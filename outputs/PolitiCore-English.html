<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PolitiCore — Bách khoa tri thức chính trị kết nối khái niệm, thể chế, lịch sử và nguồn tư liệu."
    />
    <title>PolitiCore — Tri thức chính trị, có kết nối</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <style>
:root {
  --ink: #102431;
  --ink-deep: #091721;
  --ink-soft: #294352;
  --paper: #f7f4ed;
  --paper-warm: #eeeadf;
  --paper-deep: #e2ddcf;
  --white: #fffdf8;
  --line: rgba(16, 36, 49, 0.14);
  --line-strong: rgba(16, 36, 49, 0.28);
  --gold: #b98538;
  --gold-light: #e6d1a8;
  --terracotta: #ae5843;
  --teal: #2c7274;
  --green: #2d7257;
  --slate: #66757c;
  --muted: #718087;
  --font-sans: "DM Sans", "Segoe UI", Arial, sans-serif;
  --font-serif: "Newsreader", Georgia, serif;
  --font-mono: "DM Mono", Consolas, monospace;
  --shadow-sm: 0 2px 10px rgba(9, 23, 33, 0.05);
  --shadow-lg: 0 18px 55px rgba(9, 23, 33, 0.14);
  --radius: 3px;
  --page: min(1180px, calc(100% - 48px));
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  background: var(--paper);
}

body {
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at 80% -10%, rgba(201, 155, 80, 0.08), transparent 28rem),
    var(--paper);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button,
input,
select {
  font: inherit;
}

button,
a,
select {
  -webkit-tap-highlight-color: transparent;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

img,
svg {
  display: block;
  max-width: 100%;
}

.skip-link {
  position: fixed;
  left: 16px;
  top: -80px;
  z-index: 200;
  padding: 11px 15px;
  color: var(--white);
  background: var(--ink);
  border-radius: var(--radius);
  transition: top 0.18s ease;
}

.skip-link:focus {
  top: 16px;
}

:focus-visible {
  outline: 3px solid rgba(185, 133, 56, 0.85);
  outline-offset: 3px;
}

.app-shell {
  min-height: 100vh;
  overflow: clip;
}

.utility-bar {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
  min-height: 34px;
  padding: 7px max(24px, calc((100vw - 1180px) / 2));
  color: rgba(255, 253, 248, 0.78);
  background: var(--ink-deep);
  font-size: 0.7rem;
  letter-spacing: 0.04em;
}

.utility-mark,
.utility-note {
  display: flex;
  align-items: center;
  gap: 8px;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #b5d9b6;
  box-shadow: 0 0 0 3px rgba(181, 217, 182, 0.12);
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 80;
  border-bottom: 1px solid var(--line);
  background: rgba(247, 244, 237, 0.93);
  backdrop-filter: blur(16px);
}

.header-inner {
  width: var(--page);
  min-height: 74px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 28px;
}

.brand {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 11px;
  color: var(--ink);
  font-weight: 700;
  letter-spacing: -0.04em;
  font-size: 1.21rem;
}

.brand-mark {
  display: grid;
  width: 31px;
  height: 31px;
  place-items: center;
  position: relative;
  border: 1px solid var(--ink);
  border-radius: 50%;
}

.brand-mark::before,
.brand-mark::after {
  position: absolute;
  content: "";
  border-radius: 50%;
}

.brand-mark::before {
  width: 17px;
  height: 17px;
  border: 1px solid var(--gold);
}

.brand-mark::after {
  width: 5px;
  height: 5px;
  background: var(--terracotta);
}

.main-nav {
  display: flex;
  flex: 1;
  gap: 3px;
  align-items: center;
}

.main-nav a {
  padding: 9px 10px;
  color: var(--ink-soft);
  font-size: 0.83rem;
  font-weight: 600;
  transition: color 0.18s ease, background 0.18s ease;
}

.main-nav a:hover,
.main-nav a.active {
  color: var(--ink);
  background: rgba(16, 36, 49, 0.055);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.language-switch {
  display: inline-flex;
  align-items: center;
  height: 37px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--paper);
}

.language-switch button {
  width: 31px;
  height: 100%;
  border: 0;
  color: var(--muted);
  background: transparent;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  transition: color 0.18s ease, background 0.18s ease;
}

.language-switch button + button {
  border-left: 1px solid var(--line);
}

.language-switch button:hover {
  color: var(--ink);
  background: rgba(16, 36, 49, 0.05);
}

.language-switch button.active {
  color: var(--white);
  background: var(--ink);
}

.search-trigger,
.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 37px;
  border: 1px solid var(--line);
  color: var(--ink);
  background: transparent;
  transition: border-color 0.18s ease, background 0.18s ease;
}

.search-trigger {
  gap: 8px;
  padding: 0 11px;
  font-size: 0.77rem;
  font-weight: 600;
}

.search-trigger .key-hint {
  padding: 2px 5px;
  color: var(--muted);
  border: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: 0.64rem;
}

.icon-button {
  width: 37px;
}

.search-trigger:hover,
.icon-button:hover {
  border-color: var(--line-strong);
  background: rgba(16, 36, 49, 0.05);
}

.menu-button {
  display: none;
}

.page {
  min-height: calc(100vh - 108px);
}

.page-width {
  width: var(--page);
  margin-inline: auto;
}

.hero {
  padding: 65px 0 32px;
  position: relative;
}

.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(340px, 0.78fr);
  gap: clamp(32px, 6vw, 94px);
  align-items: center;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin: 0 0 18px;
  color: var(--terracotta);
  font-family: var(--font-mono);
  font-size: 0.69rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.eyebrow::before {
  width: 19px;
  height: 1px;
  content: "";
  background: currentColor;
}

.hero h1,
.display-title {
  max-width: 760px;
  margin: 0;
  color: var(--ink-deep);
  font-family: var(--font-serif);
  font-size: clamp(3.25rem, 6vw, 5.25rem);
  font-weight: 500;
  letter-spacing: -0.055em;
  line-height: 0.93;
}

.hero h1 em,
.display-title em {
  color: var(--terracotta);
  font-style: italic;
  font-weight: 400;
}

.hero-intro {
  max-width: 580px;
  margin: 24px 0 28px;
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: clamp(1.13rem, 1.8vw, 1.37rem);
  line-height: 1.45;
}

.main-search {
  width: min(100%, 610px);
  position: relative;
  display: flex;
  align-items: center;
  min-height: 62px;
  border: 1px solid rgba(16, 36, 49, 0.4);
  background: var(--white);
  box-shadow: var(--shadow-sm);
}

.main-search:focus-within {
  border-color: var(--gold);
  box-shadow: 0 0 0 4px rgba(185, 133, 56, 0.12);
}

.search-icon {
  width: 20px;
  height: 20px;
  margin: 0 15px 0 18px;
  color: var(--terracotta);
  flex: 0 0 auto;
}

.main-search input {
  flex: 1;
  min-width: 0;
  padding: 16px 0;
  color: var(--ink);
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 0.94rem;
}

.main-search input::placeholder {
  color: #8a9697;
}

.main-search button {
  margin-right: 8px;
  padding: 10px 13px;
  border: 0;
  color: var(--white);
  background: var(--ink);
  font-size: 0.78rem;
  font-weight: 700;
}

.main-search button:hover {
  background: var(--terracotta);
}

.suggested-searches {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 16px;
}

.suggested-label {
  align-self: center;
  color: var(--muted);
  font-size: 0.72rem;
}

.search-chip,
.chip {
  padding: 6px 9px;
  border: 1px solid var(--line);
  color: var(--ink-soft);
  background: rgba(255, 253, 248, 0.42);
  font-size: 0.7rem;
  line-height: 1;
  transition: 0.18s ease;
}

button.search-chip:hover,
.chip:hover {
  color: var(--ink);
  border-color: var(--gold);
  background: var(--white);
}

.hero-proof {
  display: flex;
  gap: 19px;
  margin-top: 31px;
}

.proof-item {
  position: relative;
  padding-right: 19px;
}

.proof-item + .proof-item::before {
  position: absolute;
  top: 4px;
  left: -10px;
  width: 1px;
  height: 32px;
  content: "";
  background: var(--line);
}

.proof-value {
  display: block;
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 1.55rem;
  line-height: 1;
}

.proof-label {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 0.67rem;
  line-height: 1.25;
}

.atlas-panel {
  min-height: 480px;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(16, 36, 49, 0.22);
  color: var(--white);
  background:
    linear-gradient(135deg, rgba(185, 133, 56, 0.11), transparent 40%),
    linear-gradient(180deg, #173442, #0c1e29 94%);
  box-shadow: var(--shadow-lg);
}

.atlas-panel::before {
  position: absolute;
  inset: 0;
  content: "";
  opacity: 0.26;
  background-image: linear-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
  background-size: 38px 38px;
  mask-image: linear-gradient(150deg, #000, transparent 85%);
}

.atlas-label {
  position: absolute;
  z-index: 2;
  top: 21px;
  left: 22px;
  color: rgba(255, 253, 248, 0.65);
  font-family: var(--font-mono);
  font-size: 0.63rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.atlas-caption {
  position: absolute;
  z-index: 2;
  right: 20px;
  bottom: 18px;
  max-width: 190px;
  color: rgba(255, 253, 248, 0.62);
  font-family: var(--font-serif);
  font-size: 0.93rem;
  line-height: 1.35;
}

.atlas-canvas {
  width: 100%;
  height: 100%;
  min-height: 480px;
  position: absolute;
  inset: 0;
}

.atlas-line {
  stroke: rgba(232, 217, 178, 0.38);
  stroke-width: 0.85;
}

.atlas-line.faint {
  stroke: rgba(168, 205, 198, 0.21);
  stroke-dasharray: 3 5;
}

.atlas-node circle {
  fill: #f7f4ed;
  stroke: rgba(185, 133, 56, 0.88);
  stroke-width: 2;
  transition: r 0.2s ease, fill 0.2s ease;
}

.atlas-node:hover circle {
  fill: var(--gold-light);
  r: 7;
}

.atlas-node .node-label {
  fill: rgba(255, 253, 248, 0.86);
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 600;
}

.atlas-node.main circle {
  fill: var(--gold);
  stroke: #f7f4ed;
}

.atlas-node.main .node-label {
  fill: #fffdf8;
  font-size: 12px;
}

.atlas-legend {
  position: absolute;
  z-index: 2;
  bottom: 20px;
  left: 22px;
  display: flex;
  gap: 10px;
  align-items: center;
  color: rgba(255, 253, 248, 0.6);
  font-size: 0.63rem;
}

.legend-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gold);
}

.page-section {
  padding: 70px 0;
}

.page-section.border-top {
  border-top: 1px solid var(--line);
}

.section-kicker {
  margin: 0 0 10px;
  color: var(--terracotta);
  font-family: var(--font-mono);
  font-size: 0.66rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.section-heading {
  max-width: 620px;
  margin: 0;
  color: var(--ink-deep);
  font-family: var(--font-serif);
  font-size: clamp(2.25rem, 4vw, 3.5rem);
  font-weight: 500;
  letter-spacing: -0.045em;
  line-height: 0.97;
}

.section-description {
  max-width: 560px;
  margin: 18px 0 0;
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: 1.05rem;
  line-height: 1.48;
}

.section-header {
  display: flex;
  justify-content: space-between;
  gap: 30px;
  align-items: flex-end;
  margin-bottom: 32px;
}

.text-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 3px;
  color: var(--ink);
  border-bottom: 1px solid var(--gold);
  font-size: 0.8rem;
  font-weight: 700;
  white-space: nowrap;
}

.text-link::after {
  content: "↗";
  font-size: 0.94rem;
}

.text-link:hover {
  color: var(--terracotta);
}

.topic-editorial-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.8fr);
  gap: 58px;
  align-items: start;
}

.topic-list {
  border-top: 1px solid var(--line-strong);
}

.topic-row {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) minmax(160px, 0.48fr) 18px;
  gap: 16px;
  align-items: center;
  width: 100%;
  padding: 18px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  text-align: left;
  color: var(--ink);
  background: transparent;
}

.topic-row:hover {
  color: var(--terracotta);
}

.topic-number {
  color: var(--gold);
  font-family: var(--font-mono);
  font-size: 0.66rem;
}

.topic-name {
  font-family: var(--font-serif);
  font-size: 1.35rem;
  font-weight: 500;
  letter-spacing: -0.02em;
}

.topic-count {
  color: var(--muted);
  font-size: 0.75rem;
}

.topic-arrow {
  color: var(--gold);
  font-size: 1.15rem;
  text-align: right;
}

.feature-paper {
  position: relative;
  padding: 31px;
  overflow: hidden;
  border-top: 3px solid var(--gold);
  background: var(--white);
  box-shadow: var(--shadow-sm);
}

.feature-paper::before {
  position: absolute;
  top: -88px;
  right: -80px;
  width: 240px;
  height: 240px;
  content: "";
  border: 1px solid rgba(185, 133, 56, 0.2);
  border-radius: 50%;
  box-shadow: 0 0 0 28px rgba(185, 133, 56, 0.04), 0 0 0 58px rgba(185, 133, 56, 0.025);
}

.feature-paper > * {
  position: relative;
  z-index: 1;
}

.card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px 11px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 0.02em;
}

.card-meta .pill {
  color: var(--teal);
}

.feature-paper h3 {
  max-width: 390px;
  margin: 18px 0 13px;
  font-family: var(--font-serif);
  font-size: clamp(1.8rem, 3vw, 2.5rem);
  font-weight: 500;
  letter-spacing: -0.04em;
  line-height: 0.98;
}

.feature-paper p {
  max-width: 470px;
  margin: 0 0 22px;
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: 1rem;
  line-height: 1.45;
}

.article-link {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: var(--ink);
  font-size: 0.78rem;
  font-weight: 700;
}

.article-link::after {
  content: "→";
  color: var(--terracotta);
  font-size: 1.05rem;
  transition: transform 0.2s ease;
}

.article-link:hover::after {
  transform: translateX(4px);
}

.connection-strip {
  position: relative;
  padding: 0;
  color: var(--white);
  background: var(--ink-deep);
}

.connection-strip-inner {
  width: var(--page);
  min-height: 222px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 0.72fr 1.28fr;
  gap: 40px;
  align-items: center;
}

.connection-strip .section-kicker {
  color: var(--gold-light);
}

.connection-strip .section-heading {
  color: var(--white);
  font-size: clamp(2rem, 3.3vw, 3rem);
}

.connection-strip .section-description {
  color: rgba(255, 253, 248, 0.66);
  font-size: 0.95rem;
}

.connection-map {
  position: relative;
  height: 175px;
}

.connection-map svg {
  width: 100%;
  height: 100%;
}

.concept-tag {
  position: absolute;
  padding: 6px 9px;
  color: rgba(255, 253, 248, 0.9);
  border: 1px solid rgba(255, 253, 248, 0.25);
  background: rgba(255, 253, 248, 0.05);
  font-size: 0.67rem;
  transition: 0.2s ease;
}

.concept-tag:hover {
  color: var(--ink);
  background: var(--gold-light);
}

.concept-tag.central {
  padding: 9px 13px;
  color: var(--ink-deep);
  border-color: var(--gold);
  background: var(--gold);
  font-weight: 700;
}

.timeline-grid {
  display: grid;
  grid-template-columns: minmax(220px, 0.5fr) minmax(0, 1.5fr);
  gap: 52px;
  align-items: start;
}

.timeline-intro {
  position: sticky;
  top: 104px;
}

.timeline-list {
  border-left: 1px solid var(--line-strong);
}

.timeline-item {
  position: relative;
  display: grid;
  grid-template-columns: 102px minmax(0, 1fr);
  gap: 21px;
  padding: 0 0 33px 27px;
}

.timeline-item::before {
  position: absolute;
  top: 5px;
  left: -5px;
  width: 9px;
  height: 9px;
  content: "";
  border: 2px solid var(--paper);
  border-radius: 50%;
  background: var(--terracotta);
}

.timeline-item:last-child {
  padding-bottom: 0;
}

.timeline-year {
  color: var(--terracotta);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 500;
}

.timeline-content h3 {
  margin: -4px 0 6px;
  font-family: var(--font-serif);
  font-size: 1.4rem;
  font-weight: 500;
  letter-spacing: -0.025em;
}

.timeline-content p {
  max-width: 580px;
  margin: 0;
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: 0.94rem;
  line-height: 1.43;
}

.directory-panel {
  padding: 34px 0 0;
  border-top: 1px solid var(--line-strong);
}

.country-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  border: 1px solid var(--line);
  background: var(--line);
}

.country-card {
  min-height: 220px;
  display: flex;
  flex-direction: column;
  padding: 22px;
  color: var(--ink);
  background: var(--paper);
  transition: color 0.18s ease, background 0.18s ease;
}

.country-card:hover {
  color: var(--white);
  background: var(--ink);
}

.country-card:hover .country-region,
.country-card:hover .country-sub {
  color: rgba(255, 253, 248, 0.65);
}

.country-card:hover .country-arrow {
  color: var(--gold-light);
}

.country-region {
  color: var(--terracotta);
  font-family: var(--font-mono);
  font-size: 0.63rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.country-card h3 {
  margin: 25px 0 6px;
  font-family: var(--font-serif);
  font-size: 1.7rem;
  font-weight: 500;
  letter-spacing: -0.03em;
}

.country-sub {
  margin: 0;
  color: var(--muted);
  font-family: var(--font-serif);
  font-size: 0.86rem;
  line-height: 1.35;
}

.country-arrow {
  margin-top: auto;
  color: var(--gold);
  font-size: 1.15rem;
}

.compare-callout {
  display: grid;
  grid-template-columns: minmax(0, 0.85fr) minmax(360px, 1.15fr);
  gap: 58px;
  align-items: center;
  padding: 60px 0;
}

.compare-callout .section-description {
  margin-bottom: 24px;
}

.mini-matrix {
  overflow: hidden;
  border-top: 2px solid var(--ink);
  background: var(--white);
  box-shadow: var(--shadow-sm);
}

.mini-matrix-row {
  display: grid;
  grid-template-columns: 1.1fr 1fr 1fr;
  border-bottom: 1px solid var(--line);
}

.mini-matrix-row > * {
  min-height: 48px;
  display: flex;
  align-items: center;
  padding: 9px 12px;
  border-right: 1px solid var(--line);
  font-size: 0.72rem;
  line-height: 1.25;
}

.mini-matrix-row > *:last-child {
  border-right: 0;
}

.mini-matrix-row.header > * {
  min-height: 42px;
  color: var(--muted);
  background: var(--paper-warm);
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.mini-matrix-row > strong {
  color: var(--ink-soft);
  font-size: 0.69rem;
}

.matrix-mark {
  width: 8px;
  height: 8px;
  margin-right: 7px;
  border-radius: 50%;
  background: var(--gold);
}

.matrix-mark.alt {
  background: var(--teal);
}

.source-band {
  padding: 58px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: rgba(238, 234, 223, 0.45);
}

.source-layout {
  display: grid;
  grid-template-columns: 0.68fr 1.32fr;
  gap: 58px;
}

.source-layout .section-heading {
  font-size: clamp(2rem, 3.4vw, 2.85rem);
}

.source-list {
  border-top: 1px solid var(--line-strong);
}

.source-row {
  display: grid;
  grid-template-columns: 66px minmax(0, 1fr) 17px;
  gap: 14px;
  align-items: center;
  padding: 17px 0;
  border-bottom: 1px solid var(--line);
}

.source-type {
  color: var(--teal);
  font-family: var(--font-mono);
  font-size: 0.61rem;
  text-transform: uppercase;
}

.source-name {
  font-family: var(--font-serif);
  font-size: 1.04rem;
  line-height: 1.1;
}

.source-year {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-family: var(--font-sans);
  font-size: 0.67rem;
}

.source-row:hover .source-name {
  color: var(--terracotta);
}

.site-footer {
  color: rgba(255, 253, 248, 0.75);
  background: var(--ink-deep);
}

.footer-inner {
  width: var(--page);
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 60px;
  padding: 42px 0 28px;
  margin: 0 auto;
}

.footer-brand {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  color: var(--white);
  font-size: 1.12rem;
  font-weight: 700;
  letter-spacing: -0.035em;
}

.footer-brand .brand-mark {
  border-color: rgba(255, 253, 248, 0.8);
}

.footer-copy {
  max-width: 460px;
  margin: 14px 0 0;
  color: rgba(255, 253, 248, 0.62);
  font-family: var(--font-serif);
  font-size: 0.93rem;
  line-height: 1.45;
}

.footer-nav {
  display: flex;
  flex-wrap: wrap;
  align-content: start;
  justify-content: flex-end;
  gap: 10px 22px;
  padding-top: 5px;
}

.footer-nav a {
  color: rgba(255, 253, 248, 0.7);
  font-size: 0.73rem;
}

.footer-nav a:hover {
  color: var(--gold-light);
}

.footer-bottom {
  width: var(--page);
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 15px 0 19px;
  margin: 0 auto;
  border-top: 1px solid rgba(255, 253, 248, 0.14);
  color: rgba(255, 253, 248, 0.42);
  font-family: var(--font-mono);
  font-size: 0.61rem;
}

/* Directory and detail pages */
.page-hero {
  padding: 61px 0 35px;
  border-bottom: 1px solid var(--line);
  background:
    radial-gradient(circle at 87% 0, rgba(185, 133, 56, 0.09), transparent 25rem),
    var(--paper);
}

.page-hero .display-title {
  font-size: clamp(3.2rem, 6vw, 5.5rem);
}

.page-lede {
  max-width: 650px;
  margin: 20px 0 0;
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: 1.16rem;
  line-height: 1.45;
}

.bread-crumbs {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 22px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.65rem;
}

.bread-crumbs a:hover {
  color: var(--terracotta);
}

.bread-crumbs span:last-child {
  color: var(--ink-soft);
}

.tool-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: center;
  justify-content: space-between;
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
}

.result-count {
  color: var(--muted);
  font-size: 0.76rem;
}

.filter-group {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.filter-button,
.filter-select {
  min-height: 32px;
  padding: 0 10px;
  border: 1px solid var(--line);
  color: var(--ink-soft);
  background: transparent;
  font-size: 0.71rem;
  font-weight: 600;
}

.filter-button:hover,
.filter-button.active,
.filter-select:focus {
  color: var(--ink);
  border-color: var(--gold);
  background: var(--white);
}

.filter-select {
  outline: 0;
}

.content-grid {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  gap: 44px;
  padding: 34px 0 74px;
}

.side-panel {
  position: sticky;
  top: 102px;
  align-self: start;
  padding: 0 0 20px;
  border-top: 2px solid var(--ink);
}

.side-panel-heading {
  margin: 17px 0 10px;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.taxonomy-link {
  display: block;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  color: var(--ink-soft);
  font-size: 0.77rem;
  line-height: 1.2;
}

.taxonomy-link:hover,
.taxonomy-link.active {
  color: var(--terracotta);
}

.taxonomy-link small {
  float: right;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.6rem;
}

.article-tiles {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  border: 1px solid var(--line);
  background: var(--line);
}

.article-tile {
  min-height: 220px;
  display: flex;
  flex-direction: column;
  padding: 24px;
  color: var(--ink);
  background: var(--white);
  transition: color 0.18s ease, background 0.18s ease;
}

.article-tile:hover {
  color: var(--white);
  background: var(--ink);
}

.article-tile:hover .card-meta,
.article-tile:hover .article-tile-summary {
  color: rgba(255, 253, 248, 0.68);
}

.article-tile h3 {
  margin: 19px 0 9px;
  font-family: var(--font-serif);
  font-size: 1.55rem;
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 1;
}

.article-tile-summary {
  margin: 0;
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: 0.89rem;
  line-height: 1.39;
}

.tile-bottom {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  align-items: center;
  margin-top: auto;
  padding-top: 19px;
  color: var(--gold);
  font-family: var(--font-mono);
  font-size: 0.62rem;
}

.empty-state {
  padding: 54px 30px;
  border: 1px dashed var(--line-strong);
  text-align: center;
  color: var(--muted);
}

.empty-state h2 {
  margin: 0 0 8px;
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 1.9rem;
  font-weight: 500;
}

.alpha-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
}

.alpha-nav button {
  width: 29px;
  height: 29px;
  border: 0;
  color: var(--ink-soft);
  background: transparent;
  font-family: var(--font-mono);
  font-size: 0.68rem;
}

.alpha-nav button.active,
.alpha-nav button:hover {
  color: var(--white);
  background: var(--ink);
}

.glossary-list {
  padding: 20px 0 70px;
}

.glossary-group {
  display: grid;
  grid-template-columns: 93px minmax(0, 1fr);
  gap: 20px;
  padding: 27px 0;
  border-bottom: 1px solid var(--line);
}

.glossary-letter {
  color: var(--gold);
  font-family: var(--font-serif);
  font-size: 3.3rem;
  line-height: 0.85;
}

.glossary-entries {
  display: grid;
  gap: 20px;
}

.glossary-entry {
  display: grid;
  grid-template-columns: minmax(155px, 0.42fr) minmax(0, 1fr);
  gap: 22px;
}

.glossary-term {
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 1.36rem;
  font-weight: 500;
  letter-spacing: -0.02em;
}

.glossary-term span {
  display: block;
  margin-top: 4px;
  color: var(--teal);
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 0.04em;
}

.glossary-definition {
  margin: 0;
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: 0.94rem;
  line-height: 1.42;
}

.country-directory {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1px;
  padding: 31px 0 70px;
  background: var(--line);
}

.country-directory .country-card {
  min-height: 248px;
  background: var(--paper);
}

.country-directory .country-card:hover {
  background: var(--ink);
}

.country-metadata {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 16px;
}

.country-metadata span {
  padding: 4px 6px;
  border: 1px solid currentColor;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.57rem;
}

.country-card:hover .country-metadata span {
  color: rgba(255, 253, 248, 0.55);
}

.article-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 260px;
  gap: 56px;
  padding: 34px 0 78px;
}

.article-main {
  min-width: 0;
}

.article-header {
  max-width: 800px;
  padding-bottom: 34px;
  border-bottom: 1px solid var(--line);
}

.article-domain {
  margin: 0 0 13px;
  color: var(--terracotta);
  font-family: var(--font-mono);
  font-size: 0.66rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.article-title {
  margin: 0;
  font-family: var(--font-serif);
  font-size: clamp(3rem, 5.8vw, 5rem);
  font-weight: 500;
  letter-spacing: -0.06em;
  line-height: 0.92;
}

.article-dek {
  max-width: 690px;
  margin: 21px 0 19px;
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: 1.27rem;
  line-height: 1.42;
}

.article-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.small-action {
  padding: 7px 9px;
  border: 1px solid var(--line);
  color: var(--ink-soft);
  background: transparent;
  font-size: 0.68rem;
  font-weight: 600;
}

.small-action:hover {
  border-color: var(--gold);
  color: var(--terracotta);
}

.article-body {
  max-width: 750px;
  padding-top: 34px;
}

.article-body h2 {
  margin: 43px 0 12px;
  font-family: var(--font-serif);
  font-size: 2.05rem;
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 1.03;
}

.article-body p {
  margin: 0 0 18px;
  color: #263e4a;
  font-family: var(--font-serif);
  font-size: 1.1rem;
  line-height: 1.57;
}

.article-body .lead {
  color: var(--ink);
  font-size: 1.27rem;
  line-height: 1.47;
}

.definition-box {
  display: grid;
  grid-template-columns: 105px 1fr;
  gap: 18px;
  margin: 31px 0;
  padding: 21px;
  border-left: 3px solid var(--gold);
  background: rgba(238, 234, 223, 0.7);
}

.definition-box strong {
  color: var(--terracotta);
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.definition-box p {
  margin: 0;
  font-size: 1.02rem;
}

.article-figure {
  margin: 33px 0;
  padding: 24px;
  border: 1px solid var(--line);
  background: var(--white);
}

.figure-title {
  display: block;
  margin-bottom: 19px;
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 1.25rem;
  font-weight: 500;
}

.power-diagram {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.power-node {
  padding: 17px 12px;
  color: var(--ink-soft);
  border-top: 2px solid var(--teal);
  background: var(--paper);
  text-align: center;
  font-family: var(--font-serif);
  font-size: 1.02rem;
}

.power-node small {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-family: var(--font-sans);
  font-size: 0.64rem;
}

.article-figure figcaption {
  margin-top: 15px;
  color: var(--muted);
  font-size: 0.7rem;
  line-height: 1.4;
}

.citation {
  color: var(--terracotta);
  font-family: var(--font-mono);
  font-size: 0.67em;
  vertical-align: super;
}

.article-aside {
  position: sticky;
  top: 103px;
  align-self: start;
}

.aside-box {
  margin-bottom: 18px;
  padding: 19px;
  border-top: 2px solid var(--ink);
  background: rgba(238, 234, 223, 0.46);
}

.aside-box h3 {
  margin: 0 0 12px;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.toc-link {
  display: block;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: 0.86rem;
}

.toc-link:hover {
  color: var(--terracotta);
}

.aside-fact {
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}

.aside-fact span {
  display: block;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.57rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.aside-fact strong {
  display: block;
  margin-top: 3px;
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 0.93rem;
  font-weight: 500;
}

.related-panel {
  margin-top: 47px;
  padding-top: 25px;
  border-top: 1px solid var(--line-strong);
}

.related-panel h2 {
  margin: 0 0 17px;
  font-size: 1.75rem;
}

.related-list {
  display: grid;
  gap: 1px;
  background: var(--line);
}

.related-list a {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 15px;
  color: var(--ink);
  background: var(--white);
  font-family: var(--font-serif);
  font-size: 1.07rem;
}

.related-list a:hover {
  color: var(--terracotta);
  background: var(--paper-warm);
}

.references {
  margin-top: 46px;
  padding-top: 24px;
  border-top: 1px solid var(--line-strong);
}

.references h2 {
  margin: 0 0 17px;
  font-size: 1.75rem;
}

.reference-item {
  display: grid;
  grid-template-columns: 23px 1fr;
  gap: 8px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: 0.86rem;
  line-height: 1.35;
}

.reference-number {
  color: var(--terracotta);
  font-family: var(--font-mono);
  font-size: 0.62rem;
}

.reference-item a:hover {
  color: var(--terracotta);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.compare-page {
  padding: 34px 0 76px;
}

.compare-controls {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr)) auto;
  gap: 12px;
  align-items: end;
  padding: 22px;
  border-top: 2px solid var(--ink);
  background: var(--paper-warm);
}

.control-label {
  display: block;
  margin-bottom: 7px;
  color: var(--ink-soft);
  font-family: var(--font-mono);
  font-size: 0.61rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.compare-controls select {
  width: 100%;
  min-height: 41px;
  padding: 0 11px;
  border: 1px solid var(--line-strong);
  color: var(--ink);
  background: var(--white);
  outline: 0;
  font-size: 0.82rem;
}

.button-primary {
  min-height: 41px;
  padding: 0 17px;
  border: 1px solid var(--ink);
  color: var(--white);
  background: var(--ink);
  font-size: 0.76rem;
  font-weight: 700;
}

.button-primary:hover {
  border-color: var(--terracotta);
  background: var(--terracotta);
}

.comparison-note {
  margin: 16px 0 0;
  color: var(--muted);
  font-size: 0.71rem;
  line-height: 1.4;
}

.comparison-table-wrap {
  overflow-x: auto;
  margin-top: 28px;
  border: 1px solid var(--line);
  background: var(--white);
}

.comparison-table {
  width: 100%;
  min-width: 650px;
  border-collapse: collapse;
  text-align: left;
}

.comparison-table th,
.comparison-table td {
  padding: 16px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}

.comparison-table th:last-child,
.comparison-table td:last-child {
  border-right: 0;
}

.comparison-table thead th {
  color: var(--ink);
  background: var(--paper-warm);
  font-family: var(--font-serif);
  font-size: 1.32rem;
  font-weight: 500;
}

.comparison-table thead th:first-child {
  width: 180px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.61rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.comparison-table tbody th {
  width: 180px;
  color: var(--teal);
  background: rgba(238, 234, 223, 0.4);
  font-family: var(--font-mono);
  font-size: 0.62rem;
  font-weight: 500;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.comparison-table td {
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: 0.9rem;
  line-height: 1.38;
}

.timeline-page {
  padding: 30px 0 78px;
}

.timeline-filters {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  padding: 18px;
  border-top: 2px solid var(--ink);
  background: var(--paper-warm);
}

.timeline-filters select {
  width: 100%;
  min-height: 38px;
  padding: 0 9px;
  border: 1px solid var(--line);
  color: var(--ink);
  background: var(--white);
  font-size: 0.74rem;
}

.timeline-page-list {
  margin-top: 35px;
}

.timeline-page-list .timeline-item {
  grid-template-columns: 135px minmax(0, 1fr) 150px;
}

.event-region {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.61rem;
  text-align: right;
}

.event-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

.event-tags span {
  padding: 4px 6px;
  color: var(--teal);
  border: 1px solid rgba(44, 114, 116, 0.35);
  font-family: var(--font-mono);
  font-size: 0.56rem;
}

.sources-page {
  padding: 34px 0 76px;
}

.source-library {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  background: var(--line);
}

.source-card {
  display: flex;
  flex-direction: column;
  min-height: 205px;
  padding: 24px;
  background: var(--white);
}

.source-card:hover {
  background: var(--paper-warm);
}

.source-card h3 {
  margin: 20px 0 8px;
  font-family: var(--font-serif);
  font-size: 1.38rem;
  font-weight: 500;

const localizeRecords = (records, copy = {}) => records.map((record) => ({ ...record, ...(copy[record.id] || {}) }));

function collectionsForLanguage(language) {
  const collator = new Intl.Collator(language, { sensitivity: "base" });
  const topicTitles = new Map(sourceTopics.map((topic) => [topic.id, topic.title]));

  if (language === "vi") {
    const topics = sourceTopics.map((record) => ({ ...record }));
    return {
      topics,
      articles: sourceArticles
        .map((record) => ({ ...record, domain: topicTitles.get(record.domain) || record.domain }))
        .sort((a, b) => collator.compare(a.title, b.title)),
      glossary: sourceGlossary
        .map((record) => ({ ...record, aliases: [record.english].filter(Boolean) }))
        .sort((a, b) => collator.compare(a.term, b.term)),
      countries: sourceCountries
        .map((record) => ({ ...record }))
        .sort((a, b) => collator.compare(a.region, b.region) || collator.compare(a.name, b.name)),
      ideologies: sourceIdeologies.map((record) => ({ ...record })),
      events: sourceEvents.map((record) => ({ ...record })).sort((a, b) => String(a.date).localeCompare(String(b.date), "vi")),
      sources: sourceSources
        .map((record) => ({ ...record }))
        .sort((a, b) => collator.compare(a.kind, b.kind) || Number(b.year || 0) - Number(a.year || 0) || collator.compare(a.title, b.title)),
      relationships: sourceRelationships.map((record) => ({ ...record })),
      fullTaxonomy: sourceTopics.map((topic) => topic.title),
    };
  }

  const topics = localizeRecords(sourceTopics, englishCopy.topics);
  return {
    topics,
    articles: localizeRecords(sourceArticles, englishCopy.articles)
      .map((record) => ({ ...record, domain: englishCopy.topics[record.domain]?.title || record.domain }))
      .sort((a, b) => collator.compare(a.title, b.title)),
    glossary: sourceGlossary.map((record) => ({
      ...record,
      ...(englishCopy.glossary[record.id] || {}),
      aliases: [record.term, record.english].filter(Boolean),
      english: "",
    })).sort((a, b) => collator.compare(a.term, b.term)),
    countries: localizeRecords(sourceCountries, englishCopy.countries)
      .sort((a, b) => collator.compare(a.region, b.region) || collator.compare(a.name, b.name)),
    ideologies: localizeRecords(sourceIdeologies, englishCopy.ideologies),
    events: localizeRecords(sourceEvents, englishCopy.events).sort((a, b) => String(a.date).localeCompare(String(b.date), "en")),
    sources: sourceSources.map((record) => ({
      ...record,
      ...(englishCopy.sources[record.id] || {}),
      kind: englishCopy.sourceKinds[record.kind] || record.kind,
    })).sort((a, b) => collator.compare(a.kind, b.kind) || Number(b.year || 0) - Number(a.year || 0) || collator.compare(a.title, b.title)),
    relationships: sourceRelationships.map((record) => ({
      ...record,
      label: englishCopy.relationshipLabels[record.label] || record.label,
    })),
    fullTaxonomy: sourceTopics.map((topic) => englishCopy.topics[topic.id]?.title || topic.title),
  };
}

let currentLanguage = "vi";
try {
  const savedLanguage = localStorage.getItem("politicore-language");
  if (["en", "vi"].includes(savedLanguage)) currentLanguage = savedLanguage;
} catch {
  // Language persistence is optional when storage is unavailable.
}

let { topics, articles, glossary, countries, ideologies, events, sources, relationships, fullTaxonomy } = collectionsForLanguage(currentLanguage);
const app = document.querySelector("#app");

const state = {
  searchOpen: false,
  query: "",
  searchType: "all",
  glossaryLetter: "all",
  countryRegion: "all",
  timelineRegion: "all",
  timelineTag: "all",
  compareLeft: ideologies[0]?.slug || "",
  compareRight: ideologies[1]?.slug || ideologies[0]?.slug || "",
};

function sourceRecordId(reference, sourceRecords, translations = {}) {
  return sourceRecords.find((record) => (
    record.id === reference
    || record.slug === reference
    || translations[record.id]?.slug === reference
  ))?.id;
}

function currentRecordByReference(reference, currentRecords, sourceRecords, translations = {}) {
  const id = sourceRecordId(reference, sourceRecords, translations);
  return currentRecords.find((record) => record.id === id || record.slug === reference);
}

function updateDocumentLanguage() {
  document.documentElement.lang = currentLanguage;
  document.title = currentLanguage === "vi"
    ? "PolitiCore — Tri thức chính trị, có kết nối"
    : "PolitiCore — Political Knowledge, Connected";
  const description = document.querySelector('meta[name="description"]');
  if (description) {
    description.content = currentLanguage === "vi"
      ? "PolitiCore — Bách khoa tri thức chính trị kết nối khái niệm, thể chế, lịch sử và nguồn tư liệu."
      : "PolitiCore — a connected political knowledge library for concepts, institutions, history, and source material.";
  }
  const skipLink = document.querySelector(".skip-link");
  if (skipLink) skipLink.textContent = currentLanguage === "vi" ? "Bỏ qua điều hướng" : "Skip to content";
}

function changeLanguage(language) {
  if (!["en", "vi"].includes(language) || language === currentLanguage) return;

  const selectedLeftId = sourceRecordId(state.compareLeft, sourceIdeologies, englishCopy.ideologies);
  const selectedRightId = sourceRecordId(state.compareRight, sourceIdeologies, englishCopy.ideologies);
  ({ topics, articles, glossary, countries, ideologies, events, sources, relationships, fullTaxonomy } = collectionsForLanguage(language));
  currentLanguage = language;
  state.compareLeft = ideologies.find((item) => item.id === selectedLeftId)?.slug || ideologies[0]?.slug || "";
  state.compareRight = ideologies.find((item) => item.id === selectedRightId)?.slug || ideologies[1]?.slug || ideologies[0]?.slug || "";
  state.glossaryLetter = "all";
  updateDocumentLanguage();

  try {
    localStorage.setItem("politicore-language", currentLanguage);
  } catch {
    // The toggle still works when storage is unavailable.
  }
}

updateDocumentLanguage();

function escapeHtml(value = "") {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

const uiTextEntries = Object.entries(uiText).sort(([a], [b]) => b.length - a.length);

function translateUiText(value = "") {
  if (currentLanguage === "vi") return String(value);
  return uiTextEntries.reduce((result, [vietnamese, english]) => result.replaceAll(vietnamese, english), String(value));
}

function routeFor(record) {
  if (!record) return "home";
  if (record.type === "article") return `article/${record.slug}`;
  if (record.type === "country") return `country/${record.slug}`;
  if (record.type === "ideology") return `ideology/${record.slug}`;
  if (record.type === "glossary") return `glossary?term=${encodeURIComponent(record.term)}`;
  if (record.type === "event") return "timeline";
  if (record.type === "source") return "sources";
  return "home";
}

function navigate(path) {
  location.hash = `#${path}`;
}

function getRoute() {
  const hash = location.hash.replace(/^#\/?/, "") || "home";
  const [path, queryString = ""] = hash.split("?");
  return {
    path: path || "home",
    params: new URLSearchParams(queryString),
  };
}

  const attrs = `width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"`;

    menu: `<svg ${attrs}><path d="M4 7h16M4 12h16M4 17h16"></path></svg>`,

function statusLine(record) {
  const update = record?.updated || record?.lastReviewed || "10.10.2026";
  return `<div class="card-meta"><span class="pill">Đã biên tập</span><span>Cập nhật ${escapeHtml(update)}</span></div>`;
}

function topicName(topic) {
  return topic?.name || topic?.title || "";
}

function topicKey(topic) {
  return topic?.id || topic?.slug || topicName(topic);
}

function articleByReference(reference) {
  return currentRecordByReference(reference, articles, sourceArticles, englishCopy.articles);
}

function articlePath(reference, fallback = articles[0]?.slug || "") {
  return articleByReference(reference)?.slug || fallback;
}

  return `
    ${pageHero("Thư viện tham chiếu", "Bách khoa chính trị", "Một cấu trúc phân cấp để bắt đầu từ miền kiến thức, đi vào chủ đề, rồi mở các mục tham chiếu có nguồn.")}

  const relatedArticles = related
    .map((id) => articles.find((item) => item.id === id || item.slug === id))
    .filter(Boolean)
    .slice(0, 4);
  const articleSources = (article.sourceIds || []).map((id) => sources.find((source) => source.id === id)).filter(Boolean);

  return `
    ${pageHero(article.domain || "Mục tham chiếu", article.title, article.summary, [{ label: "Bách khoa", href: "#encyclopedia" }, { label: article.domain || "Mục tham chiếu" }, { label: article.title }])}

          </div>
        </header>
        <div class="article-body">
          <p class="lead">${escapeHtml(article.intro || article.summary)}</p>
          <div class="definition-box"><strong>Định nghĩa ngắn</strong><p>${escapeHtml(article.definition || article.summary)}</p></div>
          ${content.map((section, index) => `
            <section id="section-${index + 1}">
              <h2>${escapeHtml(section.heading)}</h2>
              ${section.paragraphs.map((paragraph, paragraphIndex) => `<p>${escapeHtml(paragraph)}${paragraphIndex === 0 && articleSources.length ? `<sup class="citation">[${Math.min(index + 1, articleSources.length)}]</sup>` : ""}</p>`).join("")}
            </section>
            ${index === 0 ? articleFigure(article) : ""}
          `).join("")}

          <section class="related-panel">
            <h2>Mở rộng từ đây</h2>
            <div class="related-list">
              ${relatedArticles.length ? relatedArticles.map((relatedArticle) => `<a href="#article/${relatedArticle.slug}"><span>${escapeHtml(relatedArticle.title)}</span><span>→</span></a>`).join("") : `<a href="#encyclopedia"><span>Khám phá thêm mục trong bách khoa</span><span>→</span></a>`}
            </div>
          </section>

          <section class="references" id="references">
            <h2>Nguồn &amp; ghi chú</h2>
            ${articleSources.length ? articleSources.map((source, index) => `
              <div class="reference-item"><span class="reference-number">${index + 1}</span><span><a href="${escapeHtml(source.url)}" target="_blank" rel="noreferrer">${escapeHtml(source.title)}</a> · ${escapeHtml(source.publisher || source.author || source.kind || "Nguồn tham chiếu")}</span></div>
            `).join("") : `<p class="article-tile-summary">Mục demo này chưa được gắn nguồn chi tiết. Hãy xem thư viện nguồn để kiểm tra dữ liệu có sẵn.</p>`}

function normalizedContent(article) {
  if (Array.isArray(article.content) && article.content.length) {
    return article.content.map((section) => {
      if (typeof section === "string") return { heading: "Góc nhìn tham chiếu", paragraphs: [section] };
      return {
        heading: section.heading || section.title || "Góc nhìn tham chiếu",
        paragraphs: Array.isArray(section.paragraphs) ? section.paragraphs : [section.body || section.text || article.summary],
      };
    });
  }
  return [
    { heading: "Phạm vi và cách dùng", paragraphs: [article.summary, "Mục tham chiếu này được thiết kế để định hướng khái niệm, dẫn đến các nguồn có thể kiểm tra và mở ra những liên hệ phù hợp."] },
    { heading: "Bối cảnh và tranh luận", paragraphs: ["Trong khoa học chính trị, cùng một thuật ngữ có thể được dùng theo nhiều truyền thống nghiên cứu. Vì vậy, định nghĩa nên được đọc cùng phạm vi, tiêu chí và bối cảnh lịch sử của nó."] },
    { heading: "Các mối liên hệ", paragraphs: ["Khái niệm này liên quan đến những mục khác trong thư viện, giúp người đọc so sánh cơ chế, thiết chế và cách diễn giải thay vì coi nó như một nhãn độc lập."] },
  ];
}

    </figure>
  `;
}

function renderGlossary(params) {
  const query = (params.get("q") || params.get("term") || "").trim().toLocaleLowerCase(currentLanguage);
  const letter = params.get("letter") || state.glossaryLetter;
  const records = glossary.filter((item) => {
    const term = (item.term || item.title || "").toLocaleLowerCase(currentLanguage);
    const definition = (item.definition || item.summary || "").toLocaleLowerCase(currentLanguage);
    const aliases = (item.aliases || []).join(" ").toLocaleLowerCase(currentLanguage);
    const matchQuery = !query || term.includes(query) || definition.includes(query) || aliases.includes(query);
    const matchLetter = letter === "all" || term.startsWith(letter.toLocaleLowerCase(currentLanguage));
    return matchQuery && matchLetter;
  });
  const grouped = records.reduce((groups, item) => {
    const first = (item.term || item.title || "?").charAt(0).toUpperCase();
    groups[first] ||= [];
    groups[first].push(item);
    return groups;
  }, {});
  const alphabet = [...new Set(glossary.map((item) => (item.term || item.title || "?").charAt(0).toUpperCase()))]
    .sort((a, b) => a.localeCompare(b, currentLanguage));

  return `
    ${pageHero("Thuật ngữ chính trị", "Từ điển khái niệm", "Định nghĩa ngắn để định hướng, cùng thuật ngữ tiếng Anh và đường dẫn sang các mục tham chiếu sâu hơn.")}

        <form class="filter-group" data-glossary-search>
          <input class="filter-select" name="term" value="${escapeHtml(params.get("q") || params.get("term") || "")}" placeholder="Tìm thuật ngữ..." aria-label="Tìm thuật ngữ" />
          <button class="filter-button" type="submit">Tìm</button>
        </form>
        <span class="result-count">${records.length} thuật ngữ trong bản demo</span>
      </div>
      <nav class="alpha-nav" aria-label="Duyệt theo chữ cái">
        <button class="${letter === "all" ? "active" : ""}" data-route="glossary">Tất</button>
        ${alphabet.map((char) => `<button class="${letter === char ? "active" : ""}" data-route="glossary?letter=${encodeURIComponent(char)}">${char}</button>`).join("")}
      </nav>
      <section class="glossary-list">
        ${Object.keys(grouped).length ? Object.entries(grouped).sort(([a], [b]) => a.localeCompare(b, currentLanguage)).map(([char, items]) => `
          <section class="glossary-group">
            <div class="glossary-letter">${char}</div>
            <div class="glossary-entries">
              ${items.map((item) => `
                <a class="glossary-entry" href="#article/${articlePath(item.articleSlug || item.related?.[0])}">
                  <div class="glossary-term">${escapeHtml(item.term || item.title)}${item.english || item.translation ? `<span>${escapeHtml(item.english || item.translation)}</span>` : ""}</div>
                  <p class="glossary-definition">${escapeHtml(item.definition || item.summary)}</p>

    </div>
  `;
}

function collectSearchRecords() {
  return [
    ...articles.map((item) => ({ ...item, type: "article", label: "Bài tham chiếu", text: [item.title, item.summary, item.domain, ...(item.tags || [])].join(" ") })),
    ...glossary.map((item) => ({ ...item, type: "glossary", title: item.term || item.title, summary: item.definition || item.summary, text: [item.term || item.title, item.english || "", ...(item.aliases || []), item.definition || item.summary || ""].join(" ") })),
    ...countries.map((item) => ({ ...item, type: "country", title: item.name, summary: item.overview || item.form || item.system, text: [item.name, item.region, item.form || "", item.system || "", item.overview || ""].join(" ") })),
    ...ideologies.map((item) => ({ ...item, type: "ideology", title: item.name, summary: item.summary, text: [item.name, item.summary, ...Object.values(item.dimensions || {})].join(" ") })),
    ...events.map((item) => ({ ...item, type: "event", title: item.title, summary: item.summary, text: [item.title, item.summary, item.region || "", ...(item.tags || [])].join(" ") })),
    ...sources.map((item) => ({ ...item, type: "source", summary: item.description || item.publisher || item.author, text: [item.title, item.publisher || "", item.author || "", item.description || ""].join(" ") })),
  ];
}

function searchRecords(query, type = "all") {
  const normalized = query.trim().toLocaleLowerCase(currentLanguage);
  if (!normalized) return [];
  const tokens = normalized.split(/\s+/).filter(Boolean);
  return collectSearchRecords()
    .filter((record) => type === "all" || record.type === type)
    .map((record) => {
      const haystack = (record.text || "").toLocaleLowerCase(currentLanguage);
      const score = tokens.reduce((total, token) => total + (haystack.includes(token) ? 1 : 0), 0);
      return { ...record, score };
    })
    .filter((record) => record.score === tokens.length)
    .sort((a, b) => b.score - a.score || String(a.title).localeCompare(String(b.title), currentLanguage));
}

function highlight(value, query) {
  const safe = escapeHtml(value || "");
  const term = String(query || "").trim();
  if (!term) return safe;
  const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(`(${escaped})`, "gi"), "<mark>$1</mark>");
}

function searchLabel(type) {
  return { article: "Bài tham chiếu", glossary: "Thuật ngữ", country: "Quốc gia", ideology: "Hệ tư tưởng", event: "Sự kiện", source: "Nguồn" }[type] || "Mục";
}

      </form>
      <div class="tool-bar">
        <span class="result-count">${query ? `${records.length} kết quả cho “${escapeHtml(query)}”` : "Nhập từ khoá để bắt đầu"}</span>
        <div class="filter-group">
          ${[["all", "Tất cả"], ["article", "Bài viết"], ["glossary", "Thuật ngữ"], ["country", "Quốc gia"], ["ideology", "Hệ tư tưởng"], ["event", "Sự kiện"], ["source", "Nguồn"]].map(([value, label]) => `<button class="filter-button ${type === value ? "active" : ""}" data-route="search?q=${encodeURIComponent(query)}&type=${value}">${label}</button>`).join("")}
        </div>
      </div>
      <div class="search-results">
        ${query ? (records.length ? records.map((record) => `
          <a class="search-result" href="#${routeFor(record)}">
            <span class="result-type">${searchLabel(record.type)}</span>
            <span><h2>${highlight(record.title || record.term, query)}</h2><p>${highlight(record.summary || record.definition || "", query)}</p></span>
            <span class="search-result-arrow">→</span>
          </a>
        `).join("") : emptyState("Chưa có kết quả phù hợp", "Thử một từ khoá ngắn hơn hoặc chuyển sang tìm tất cả loại mục.")) : emptyState("Bắt đầu với một câu hỏi", "Ví dụ: “chủ quyền”, “hệ thống nghị viện” hoặc “tính chính danh”.")}
      </div>
    </section>
  `;
}

function renderAbout() {
  const principles = [
    ["01", "Có thể truy nguồn", "Những khẳng định quan trọng cần dẫn về văn bản gốc hoặc tài liệu học thuật có thể kiểm tra, thay vì chỉ xuất hiện như một kết luận vô danh."],
    ["02", "Có bối cảnh", "Khái niệm, thể chế và sự kiện được trình bày cùng thời kỳ, phạm vi và giới hạn — đặc biệt khi việc phân loại còn có tranh luận."],
    ["03", "Không đảng phái", "PolitiCore không được thiết kế như nơi cổ động. Sự cân bằng nằm ở cách trình bày bằng chứng và các bất đồng học thuật một cách trung thực."],
    ["04", "Có thể mở rộng", "Bản demo dùng dữ liệu địa phương có cấu trúc để mô phỏng cách một hệ thống nội dung, nguồn và quan hệ có thể lớn dần mà không phải thiết kế lại."],
  ];
  return `
    ${pageHero("Về sản phẩm", "Tri thức là sản phẩm.", "PolitiCore là một mẫu giao diện cho bách khoa chính trị có cấu trúc, lấy việc tra cứu, so sánh và lần theo nguồn làm trải nghiệm cốt lõi.")}
    <section class="page-width about-page">
      <p class="page-lede" style="margin-top:0">Đây là bản demo chạy cục bộ. Những mục có sẵn được gắn nhãn dữ liệu demo, không giả định tích hợp cơ sở dữ liệu trực tuyến hoặc tình trạng chính trị theo thời gian thực.</p>
      <div class="principles-grid">${principles.map(([number, title, description]) => `<article class="principle"><span class="principle-number">${number}</span><h2>${title}</h2><p>${description}</p></article>`).join("")}</div>
      <section class="related-panel"><h2>Tiếp tục khám phá</h2><div class="related-list"><a href="#sources"><span>Thư viện nguồn</span><span>→</span></a><a href="#encyclopedia"><span>Taxonomy bách khoa</span><span>→</span></a></div></section>
    </section>
  `;
}

function renderNotFound() {
  return `
    <section class="page-hero"><div class="page-width"><p class="eyebrow">Không tìm thấy</p><h1 class="display-title">Mục này chưa có trong bản demo.</h1><p class="page-lede">Hãy quay lại thư viện để tiếp tục từ một khái niệm, quốc gia hoặc nguồn tư liệu khác.</p><a class="text-link" style="margin-top:23px" href="#home">Về trang khám phá</a></div></section>
  `;
}

function renderSearchDialog() {
  if (!state.searchOpen) return "";
  const records = searchRecords(state.query).slice(0, 7);
  return `
    <div class="search-overlay" data-action="close-search">
      <section class="search-dialog" role="dialog" aria-modal="true" aria-label="Tìm kiếm PolitiCore" onclick="event.stopPropagation()">
        <form class="dialog-search" data-dialog-search>
          ${icon("search", 22)}
          <input id="dialog-search-input" name="query" value="${escapeHtml(state.query)}" autocomplete="off" placeholder="Tìm khái niệm, quốc gia, nguồn..." />
          <button class="dialog-close" type="button" data-action="close-search" aria-label="Đóng tìm kiếm">${icon("close", 18)}</button>
        </form>
        <div class="dialog-results">
          ${state.query ? (records.length ? records.map((record) => `
            <a class="dialog-result" href="#${routeFor(record)}" data-action="close-search">
              <span class="dialog-result-type">${searchLabel(record.type)}</span>
              <span><strong>${escapeHtml(record.title || record.term)}</strong><span>${escapeHtml(record.summary || record.definition || "")}</span></span>
            </a>
          `).join("") : `<div class="dialog-help">Chưa có kết quả khớp. Thử một từ khoá ngắn hơn hoặc mở trang tìm kiếm để xem toàn bộ.</div>`) : `<div class="dialog-help">Gợi ý: Dân chủ · Chủ quyền · Hiến pháp · Việt Nam · Đại diện</div>`}
        </div>
      </section>
    </div>
  `;
}

function renderApp({ scroll = false } = {}) {
  const { path, params } = getRoute();
  let content = "";
  if (path === "home") content = renderHome();
  else if (path === "encyclopedia" || path === "topics") content = renderEncyclopedia(params);
  else if (path.startsWith("article/")) content = renderArticle(decodeURIComponent(path.slice("article/".length)));
  else if (path === "glossary") content = renderGlossary(params);
  else if (path === "countries") content = renderCountries(params);
  else if (path.startsWith("country/")) content = renderCountry(decodeURIComponent(path.slice("country/".length)));
  else if (path === "compare" || path === "compare/ideologies" || path === "ideologies") content = renderCompare();
  else if (path.startsWith("ideology/")) content = renderIdeology(decodeURIComponent(path.slice("ideology/".length)));
  else if (path === "timeline") content = renderTimeline(params);
  else if (path === "sources") content = renderSources();
  else if (path === "search") content = renderSearch(params);
  else if (path === "about" || path === "editorial-policy") content = renderAbout();
  else content = renderNotFound();

  app.innerHTML = translateUiText(`<div class="app-shell">${header(path)}<main id="main" class="page">${content}</main>${footer()}${renderSearchDialog()}</div>`);
  bindEvents();
  if (scroll) window.scrollTo({ top: 0, behavior: "instant" });
  if (state.searchOpen) setTimeout(() => document.querySelector("#dialog-search-input")?.focus(), 0);
}

function showToast(message) {
  const oldToast = document.querySelector(".toast");
  oldToast?.remove();
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.role = "status";
  toast.textContent = translateUiText(message);
  document.body.append(toast);
  setTimeout(() => toast.remove(), 3200);
}

function bindEvents() {
  document.querySelectorAll("[data-route]").forEach((node) => {
    node.addEventListener("click", () => navigate(node.dataset.route));
  });

  document.querySelectorAll("[data-language]").forEach((button) => {
    button.addEventListener("click", () => {
      changeLanguage(button.dataset.language);
      renderApp();
    });
  });

  document.querySelectorAll(".taxonomy-link").forEach((node) => {
    const title = node.childNodes[0]?.textContent?.trim();
    const topic = topics.find((item) => topicName(item) === title);
    if (!topic) return;
    const route = "encyclopedia?domain=" + encodeURIComponent(topicKey(topic));
    node.href = "#" + route;
    node.addEventListener("click", (event) => {
      event.preventDefault();
      navigate(route);
    });
  });

  document.querySelectorAll("[data-search-term]").forEach((button) => {
    button.addEventListener("click", () => navigate(`search?q=${encodeURIComponent(button.dataset.searchTerm)}`));
  });

  document.querySelectorAll("[data-action='open-search']").forEach((button) => {
    button.addEventListener("click", () => {
      state.searchOpen = true;
      renderApp();
    });
  });

  document.querySelectorAll("[data-action='close-search']").forEach((button) => {
    button.addEventListener("click", () => {
      state.searchOpen = false;
      renderApp();
    });
  });

  document.querySelectorAll("[data-action='toggle-menu']").forEach((button) => {
    button.addEventListener("click", () => {
      const nav = document.querySelector("#mobile-nav");
      nav.hidden = !nav.hidden;
    });
  });

  document.querySelectorAll("[data-action='copy-link']").forEach((button) => {
    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(location.href);
        showToast("Đã sao chép liên kết mục tham chiếu.");
      } catch {
        showToast("Không thể sao chép tự động. Bạn có thể sao chép URL trên thanh địa chỉ.");
      }
    });
  });

  document.querySelectorAll("[data-action='cite-article']").forEach((button) => {
    button.addEventListener("click", () => showToast("Trích dẫn gợi ý: PolitiCore, mục tham chiếu demo, truy cập 10.10.2026."));
  });

  document.querySelectorAll("[data-search-form]").forEach((form) => {
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const query = new FormData(form).get("query")?.trim();
      if (query) navigate(`search?q=${encodeURIComponent(query)}`);
    });
  });

  document.querySelectorAll("[data-search-page-form]").forEach((form) => {
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const query = new FormData(form).get("query")?.trim() || "";
      navigate(`search?q=${encodeURIComponent(query)}`);
    });
  });

  document.querySelectorAll("[data-glossary-search]").forEach((form) => {
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const query = new FormData(form).get("term")?.trim() || "";
      navigate(`glossary?q=${encodeURIComponent(query)}`);
    });
  });

  document.querySelectorAll("[data-compare-form]").forEach((form) => {
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const formData = new FormData(form);
      state.compareLeft = formData.get("left");
      state.compareRight = formData.get("right");
      renderApp();
    });
  });

  document.querySelectorAll("[data-timeline-filter]").forEach((form) => {
    form.addEventListener("change", () => {
      const formData = new FormData(form);
      navigate(`timeline?region=${encodeURIComponent(formData.get("region"))}&tag=${encodeURIComponent(formData.get("tag"))}`);
    });
  });

  const dialogForm = document.querySelector("[data-dialog-search]");
  if (dialogForm) {
    const input = dialogForm.querySelector("input");
    input.addEventListener("input", () => {
      state.query = input.value;
      const cursor = input.selectionStart;
      renderApp();
      requestAnimationFrame(() => {
        const nextInput = document.querySelector("#dialog-search-input");
        nextInput?.setSelectionRange(cursor, cursor);
      });
    });
    dialogForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (state.query.trim()) {
        state.searchOpen = false;
        navigate(`search?q=${encodeURIComponent(state.query.trim())}`);
      }
    });
  }
}

window.addEventListener("hashchange", () => {
  state.searchOpen = false;
  renderApp({ scroll: true });
});

window.addEventListener("keydown", (event) => {
  const activeElement = document.activeElement;
  const isTyping = activeElement?.tagName === "INPUT" || activeElement?.tagName === "TEXTAREA" || activeElement?.tagName === "SELECT";
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
    event.preventDefault();
    state.searchOpen = true;
    renderApp();
  }
  if (event.key === "/" && !isTyping) {
    event.preventDefault();
    state.searchOpen = true;
    renderApp();
  }
  if (event.key === "Escape" && state.searchOpen) {
    state.searchOpen = false;
    renderApp();
  }
});

renderApp();

</script>
  </body>
</html>
