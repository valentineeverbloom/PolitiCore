}

.learning-path-card > span,
.learning-path-card > strong,
.learning-path-card > small {
  display: block;
}

.learning-path-card > span {
  margin-bottom: 8px;
  color: var(--terracotta);
  font-family: var(--font-mono);
  font-size: 0.58rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.learning-path-card > strong {
  font-family: var(--font-serif);
  font-size: 1rem;
  font-weight: 500;
  line-height: 1.12;
}

.learning-path-card > small {
  margin-top: 6px;
  color: var(--muted);
  font-size: 0.67rem;
  line-height: 1.34;
}

.learning-path-card:hover,
.learning-path-card.active {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--white);
  transform: translateY(-1px);
}

.learning-path-card.active > span,
.learning-path-card:hover > span {
  color: var(--gold-light);
}

.learning-path-card.active > small,
.learning-path-card:hover > small {
  color: rgba(255, 253, 248, 0.68);
}

.learning-workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(310px, 0.43fr);
  gap: 20px;
  align-items: start;
  margin-top: 24px;
}

.learning-map-panel,
.learning-detail {
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  background: var(--white);
  box-shadow: 0 10px 28px rgba(9, 23, 33, 0.055);
}

.learning-map-toolbar {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: center;
  padding: 21px 21px 9px;
}

.learning-map-toolbar h2 {
  font-size: 1.55rem;
}

.learning-map-toolbar .section-kicker {
  margin-bottom: 6px;
}

.learning-map-controls {
  display: flex;
  gap: 5px;
  align-items: center;
}

.learning-map-controls button {
  display: grid;
  min-width: 34px;
  min-height: 34px;
  padding: 0 9px;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  color: var(--ink);
  background: var(--paper);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  transition: color 0.18s ease, background 0.18s ease, border-color 0.18s ease;
}

.learning-map-controls button:hover {
  color: var(--white);
  border-color: var(--ink);
  background: var(--ink);
}

.learning-map-hint {
  margin: 0;
  padding: 0 21px 16px;
  font-size: 0.76rem;
}

.learning-map-viewport {
  position: relative;
  min-height: 496px;
  overflow: hidden;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background:
    radial-gradient(circle at 50% 50%, rgba(185, 133, 56, 0.085), transparent 44%),
    linear-gradient(rgba(16, 36, 49, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(16, 36, 49, 0.045) 1px, transparent 1px),
    var(--paper);
  background-size: auto, 28px 28px, 28px 28px, auto;
  cursor: grab;
  touch-action: none;
}

.learning-map-viewport.is-dragging {
  cursor: grabbing;
}

.learning-map-canvas {
  position: relative;
  width: 1040px;
  height: 680px;
  margin-left: calc((100% - 1040px) / 2);
  transform-origin: 50% 50%;
  transition: transform 0.18s ease;
}

.learning-map-viewport.is-dragging .learning-map-canvas {
  transition: none;
}

.learning-map-edges {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}

.learning-map-edge {
  stroke: var(--line-strong);
  stroke-width: 2.2;
  stroke-dasharray: 5 7;
  opacity: 0.72;
}

.learning-map-edge.is-muted {
  opacity: 0.12;
}

.learning-map-node {
  position: absolute;
  z-index: 1;
  top: var(--node-y);
  left: var(--node-x);
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  column-gap: 7px;
  width: 180px;
  min-height: 66px;
  padding: 10px 11px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  color: var(--ink);
  background: var(--white);
  box-shadow: 0 6px 14px rgba(9, 23, 33, 0.08);
  text-align: left;
  transform: translate(-50%, -50%);
  transition: opacity 0.18s ease, transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}

.learning-map-node:hover,
.learning-map-node.is-selected {
  z-index: 2;
  border-color: var(--gold);
  background: var(--paper);
  box-shadow: 0 10px 24px rgba(9, 23, 33, 0.15);
  transform: translate(-50%, calc(-50% - 3px));
}

.learning-map-node.is-selected {
  box-shadow: inset 0 0 0 1px var(--gold), 0 12px 26px rgba(9, 23, 33, 0.16);
}

.learning-map-node.is-muted {
  opacity: 0.24;
}

.learning-map-node.is-muted:hover,
.learning-map-node.is-muted:focus-visible {
  opacity: 1;
}

.learning-map-node-status {
  display: grid;
  grid-row: span 2;
  width: 22px;
  height: 22px;
  place-items: center;
  border: 1px solid currentColor;
  border-radius: 50%;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.72rem;
}

.learning-map-node-title {
  align-self: end;
  font-family: var(--font-serif);
  font-size: 0.92rem;
  font-weight: 500;
  line-height: 1.05;
}

.learning-map-node-meta {
  align-self: start;
  margin-top: 4px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.53rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.status-learning .learning-map-node-status,
.status-learning.learning-status-chip,
.status-learning.learning-recommendation-meta > span:last-child {
  color: var(--teal);
}

.status-mastered .learning-map-node-status,
.status-mastered.learning-status-chip,
.status-mastered.learning-recommendation-meta > span:last-child {
  color: var(--green);
}

.status-review .learning-map-node-status,
.status-review.learning-status-chip,
.status-review.learning-recommendation-meta > span:last-child {
  color: var(--terracotta);
}

.learning-map-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 9px 15px;
  padding: 14px 20px;
  color: var(--muted);
  font-size: 0.67rem;
}

.learning-map-legend span {
  display: inline-flex;
  gap: 5px;
  align-items: center;
}

.learning-map-legend i {
  display: grid;
  width: 17px;
  height: 17px;
  place-items: center;
  border: 1px solid currentColor;
  border-radius: 50%;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.59rem;
  font-style: normal;
}

.learning-map-legend .status-learning i {
  color: var(--teal);
}

.learning-map-legend .status-mastered i {
  color: var(--green);
}

.learning-map-legend .status-review i {
  color: var(--terracotta);
}

.learning-detail {
  position: sticky;
  top: 111px;
  padding: 21px;
}

.learning-detail-header {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  margin-bottom: 13px;
}

.learning-track,
.article-learning-kicker {
  color: var(--terracotta);
  font-family: var(--font-mono);
  font-size: 0.59rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.learning-status-chip {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  padding: 4px 7px;
  border: 1px solid currentColor;
  border-radius: 999px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.56rem;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.learning-detail-level {
  margin: 9px 0 0;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.58rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.learning-detail-goal {
  margin: 18px 0;
  color: var(--ink);
  font-size: 1.05rem;
}

.learning-open-article {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  min-height: 39px;
  padding: 0 12px;
  border: 1px solid var(--ink);
  border-radius: 7px;
  color: var(--white);
  background: var(--ink);
  font-size: 0.73rem;
  font-weight: 700;
  transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
}

.learning-open-article:hover {
  color: var(--white);
  border-color: var(--terracotta);
  background: var(--terracotta);
  transform: translateY(-1px);
}

.learning-detail-section {
  margin-top: 23px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

.learning-detail-section h3 {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 1.05rem;
  font-weight: 500;
}

.learning-detail-section > p {
  margin: 8px 0 0;
  font-size: 0.86rem;
}

.learning-prerequisite-list {
  display: grid;
  gap: 5px;
  margin-top: 12px;
}

.learning-prerequisite-list button {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto;
  gap: 7px;
  align-items: center;
  width: 100%;
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink-soft);
  background: var(--paper);
  text-align: left;
}

.learning-prerequisite-list button:hover {
  color: var(--terracotta);
  border-color: var(--gold);
}

.learning-prerequisite-list button > span:first-child {
  color: var(--muted);
  font-family: var(--font-mono);
}

.learning-prerequisite-list button small {
  color: var(--muted);
  font-size: 0.58rem;
}

.learning-prerequisite-list button.is-satisfied > span:first-child,
.learning-prerequisite-list button.is-satisfied small {
  color: var(--green);
}

.learning-detail-note,
.learning-rule-note {
  padding: 10px 12px;
  border-left: 2px solid var(--gold);
  background: rgba(185, 133, 56, 0.08);
  color: var(--ink-soft);
  font-size: 0.73rem;
  line-height: 1.45;
}

.learning-detail-note {
  margin: 12px 0 0;
}

.learning-status-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.learning-status-actions button,
.learning-skip-button {
  min-height: 33px;
  padding: 0 8px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  color: var(--ink-soft);
  background: var(--white);
  font-size: 0.64rem;
  font-weight: 700;
  transition: color 0.18s ease, background 0.18s ease, border-color 0.18s ease;
}

.learning-status-actions button span {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-mono);
}

.learning-status-actions button:hover,
.learning-status-actions button.active {
  color: var(--white);
  border-color: var(--ink);
  background: var(--ink);
}

.learning-status-actions button.active span {
  color: var(--gold-light);
}

.learning-status-actions .learning-status-clear {
  color: var(--terracotta);
  border-color: rgba(174, 88, 67, 0.38);
}

.learning-status-actions .learning-status-clear:hover {
  color: var(--white);
  background: var(--terracotta);
  border-color: var(--terracotta);
}

.learning-skip-button {
  margin-top: 8px;
  color: var(--muted);
  background: transparent;
}

.learning-skip-button:hover,
.learning-skip-button.active {
  color: var(--terracotta);
  border-color: var(--terracotta);
}

.learning-detail-check {
  margin-bottom: 20px;
}

.learning-check-empty {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 0.78rem;
  line-height: 1.45;
}

.learning-check {
  margin-top: 10px;
}

.learning-check fieldset {
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

.learning-check legend {
  margin-bottom: 10px;
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: 0.88rem;
  line-height: 1.4;
}

.learning-check-options {
  display: grid;
  gap: 6px;
}

.learning-check-options label {
  display: grid;
  grid-template-columns: 15px minmax(0, 1fr);
  gap: 8px;
  align-items: start;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink-soft);
  background: var(--paper);
  font-size: 0.74rem;
  line-height: 1.35;
}

.learning-check-options label:has(input:checked) {
  border-color: var(--gold);
  background: rgba(185, 133, 56, 0.09);
}

.learning-check-options input {
  width: 15px;
  height: 15px;
  margin: 1px 0 0;
  accent-color: var(--ink);
}

.learning-check .button-primary {
  min-height: 36px;
  margin-top: 10px;
  padding: 0 10px;
  border-radius: 6px;
  font-size: 0.68rem;
}

.learning-check-result {
  display: grid;
  gap: 5px;
  margin-top: 11px;
  padding: 10px;
  border-left: 2px solid var(--green);
  background: rgba(45, 114, 87, 0.09);
  color: var(--ink-soft);
  font-size: 0.74rem;
  line-height: 1.4;
}

.learning-check-result.is-incorrect {
  border-color: var(--terracotta);
  background: rgba(174, 88, 67, 0.09);
}

.learning-check-result strong {
  color: var(--ink);
  font-size: 0.75rem;
}

.learning-check-result small {
  color: var(--muted);
  font-size: 0.64rem;
}

.learning-rule-note {
  margin: 0;
}

.learning-recommendations {
  margin-top: 62px;
}

.learning-recommendation-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--line);
}

.learning-recommendation {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  gap: 13px;
  padding: 19px;
  background: var(--white);
}

.learning-recommendation-number {
  color: var(--gold);
  font-family: var(--font-mono);
  font-size: 0.66rem;
}

.learning-recommendation-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.57rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.learning-recommendation h3 {
  margin: 10px 0 8px;
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 1.27rem;
  font-weight: 500;
  line-height: 1.05;
}

.learning-recommendation p {
  margin: 0;
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: 0.88rem;
  line-height: 1.43;
}

.learning-recommendation small {
  display: block;
  margin-top: 9px;
  color: var(--muted);
  font-size: 0.66rem;
  line-height: 1.35;
}

.learning-recommendation-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 11px;
  align-items: center;
  margin-top: 14px;
}

.learning-recommendation-actions button,
.learning-recommendation-actions a {
  min-height: 32px;
  border: 0;
  color: var(--ink);
  background: transparent;
  font-size: 0.68rem;
  font-weight: 700;
}

.learning-recommendation-actions button {
  padding: 0;
  border-bottom: 1px solid var(--gold);
}

.learning-recommendation-actions a {
  color: var(--terracotta);
}

.article-learning-panel {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: end;
  margin-top: 24px;
  padding: 16px;
  border: 1px solid rgba(185, 133, 56, 0.36);
  border-radius: 8px;
  background: linear-gradient(135deg, rgba(185, 133, 56, 0.1), transparent 70%);
}

.article-learning-copy > strong,
.article-learning-copy > p {
  display: block;
}

.article-learning-copy > strong {
  margin-top: 7px;
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 0.95rem;
  font-weight: 500;
  line-height: 1.3;
}

.article-learning-copy > p {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 0.72rem;
  line-height: 1.42;
}

.article-learning-actions {
  display: grid;
  justify-items: end;
  gap: 8px;
}

.article-learning-actions .learning-status-actions {
  justify-content: flex-end;
  margin: 0;
}

.article-learning-actions > a {
  color: var(--terracotta);
  border-bottom: 1px solid currentColor;
  font-size: 0.67rem;
  font-weight: 700;
}

@media (max-width: 980px) {
  .learning-summary {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .learning-summary .learning-summary-note {
    grid-column: 1 / -1;
    min-height: auto;
    border-top: 1px solid var(--line);
  }

  .learning-onboarding {
    grid-template-columns: 1fr;
  }

  .learning-path-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .learning-workspace {
    grid-template-columns: 1fr;
  }

  .learning-detail {
    position: static;
  }

  .learning-detail {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 0 24px;
  }

  .learning-detail-header,
  .learning-detail > h2,
  .learning-detail-level,
  .learning-detail-goal,
  .learning-open-article,
  .learning-rule-note {
    grid-column: 1 / -1;
  }

  .learning-detail-section {
    align-self: start;
  }

  .learning-detail-section.learning-detail-check {
    grid-column: 1 / -1;
  }

  .article-learning-panel {
    grid-template-columns: 1fr;
  }

  .article-learning-actions {
    justify-items: start;
  }

  .article-learning-actions .learning-status-actions {
    justify-content: flex-start;
  }
}

@media (max-width: 620px) {
  .hero-learning-links {
    gap: 8px 13px;
  }

  .hero-learning-primary {
    min-height: 39px;
    padding: 0 12px;
    font-size: 0.72rem;
  }

  .hero-learning-secondary {
    min-height: 34px;
    font-size: 0.7rem;
  }

  .learning-page {
    padding-top: 23px;
  }

  .learning-summary {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .learning-summary > div {
    min-height: 76px;
    padding: 13px;
    border-bottom: 1px solid var(--line);
  }

  .learning-summary > div:nth-child(2) {
    border-right: 0;
  }

  .learning-summary > div > span {
    font-size: 1.65rem;
  }

  .learning-summary .learning-summary-note {
    grid-column: 1 / -1;
    padding: 14px;
    border-right: 0;
    border-bottom: 0;
  }

  .learning-onboarding {
    gap: 20px;
    margin-top: 18px;
    padding: 19px;
  }

  .learning-profile-grid,
  .learning-path-grid,
  .learning-recommendation-grid {
    grid-template-columns: 1fr;
  }

  .learning-profile {
    min-height: 76px;
  }

  .learning-branch-section {
    margin-top: 41px;
  }

  .learning-branch-heading {
    display: grid;
    align-items: start;
  }

  .learning-reset-progress {
    justify-self: start;
  }

  .learning-map-toolbar {
    align-items: start;
    padding: 17px 17px 7px;
  }

  .learning-map-toolbar h2 {
    font-size: 1.35rem;
  }

  .learning-map-controls button {
    min-width: 31px;
    min-height: 31px;
    padding: 0 7px;
  }

  .learning-map-hint {
    padding: 0 17px 13px;
    font-size: 0.7rem;
  }

  .learning-map-viewport {
    min-height: 400px;
  }

  .learning-map-node {
    width: 155px;
    min-height: 59px;
    padding: 8px 9px;
  }

  .learning-map-node-title {
    font-size: 0.81rem;
  }

  .learning-map-node-meta {
    font-size: 0.49rem;
  }

  .learning-map-legend {
    gap: 7px 11px;
    padding: 11px 16px;
  }

  .learning-detail {
    display: block;
    padding: 17px;
  }

  .learning-detail-section {
    margin-top: 18px;
    padding-top: 16px;
  }

  .learning-recommendations {
    margin-top: 47px;
  }

  .learning-recommendation {
    padding: 16px;
  }

  .article-learning-panel {
    margin-top: 18px;
    padding: 13px;
  }

  .learning-status-actions {
    gap: 5px;
  }

  .learning-status-actions button,
  .learning-skip-button {
    min-height: 38px;
  }
}

/* Civitas final cascade: legacy refinement rules are intentionally kept above
   for secondary legacy routes; this layer owns the five primary experiences. */
.site-header.civitas-header {
  border-bottom-color: var(--line);
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  box-shadow: none;
}

.civitas-header .civitas-nav a {
  padding: 9px 11px;
  border-radius: 9px;
  color: var(--muted);
  background: transparent;
}

.civitas-header .civitas-nav a::after {
  display: none;
}

.civitas-header .civitas-nav a:hover,
.civitas-header .civitas-nav a.active {
  color: var(--green);
  background: #edf1e9;
}

.civitas-header .header-actions {
  gap: 7px;
}

.civitas-header .language-switch {

.app-route-home .site-header.civitas-header {

  right: 0;
  left: 0;

}

.app-route-home .civitas-brand,
.app-route-home .civitas-brand .brand-name,
.app-route-home .civitas-header .civitas-nav a,
.app-route-home .civitas-header .saved-trigger,
.app-route-home .civitas-header .civitas-search-trigger,
.app-route-home .civitas-header .icon-button {

}

.app-route-home .civitas-brand .brand-mark {

.app-route-home .brand-lockup small {

}

.app-route-home .civitas-header .civitas-nav a,
.app-route-home .civitas-header .civitas-nav a:hover,
.app-route-home .civitas-header .civitas-nav a.active {

}

.app-route-home .civitas-header .saved-trigger:hover,
.app-route-home .civitas-header .civitas-search-trigger:hover,
.app-route-home .civitas-header .icon-button:hover {

  color: #fffaf3;
  background: rgba(255, 252, 247, 0.08);
}

.app-route-home .civitas-header .language-switch {
  background: rgba(255, 252, 247, 0.13);
}

.app-route-home .civitas-header .language-switch button {

}

.app-route-home .civitas-header .language-switch button.active {
  color: #213027;
  background: #f4ecdf;
}

.app-route-home .civitas-header .theme-toggle {
  border-color: rgba(246, 240, 231, 0.28);
  background: rgba(255, 252, 247, 0.08);
}

.civitas-home--landing {
  padding: 0;
}

.civitas-home--landing .civitas-landing {
  position: relative;
  display: grid;
  min-height: min(100svh, 950px);
  overflow: hidden;
  color: #f6f0e7;
  isolation: isolate;
  background: #1d2921;
}

.civitas-landing-backdrop {
  position: absolute;
  z-index: -4;
  inset: 0;
  background: #1d2921;
}

.civitas-landing-backdrop::before,
.civitas-landing-backdrop::after {
  position: absolute;
  content: "";
  border-radius: 50%;
  pointer-events: none;
}

.civitas-landing-backdrop::before {
  top: -36vw;
  right: -20vw;
  width: 76vw;
  height: 76vw;
  border: 1px solid rgba(220, 229, 215, 0.12);
  box-shadow: 0 0 0 13vw rgba(220, 229, 215, 0.025), 0 0 0 26vw rgba(220, 229, 215, 0.018);
}

.civitas-landing-backdrop::after {
  bottom: -28vw;
  left: -14vw;
  width: 52vw;
  height: 52vw;
  border: 1px solid rgba(232, 211, 194, 0.14);
}

.civitas-landing-grain {
  position: absolute;
  z-index: -2;
  inset: 0;
  opacity: 0.34;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.19'/%3E%3C/svg%3E");
  mix-blend-mode: soft-light;
}

.civitas-landing-atlas {
  position: absolute;
  z-index: -1;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  overflow: hidden;
  pointer-events: none;
}

.civitas-landing-atlas svg {
  width: 100%;
  height: 100%;
  min-width: 1050px;
  opacity: 0.86;
}

.landing-atlas-grid path,
.landing-atlas-grid circle,
.landing-atlas-lines line {
  fill: none;
  stroke: rgba(216, 226, 209, 0.19);
  stroke-width: 1;
}

.landing-atlas-grid path {
  stroke-dasharray: 9 13;
}

.landing-atlas-lines line {
  stroke: rgba(232, 211, 194, 0.26);
  stroke-dasharray: 6 8;
}

.landing-atlas-nodes circle {
  fill: #c7aaa9;
  stroke: #f6f0e7;
  stroke-width: 1;
}

.landing-atlas-label {
  position: absolute;
  padding: 7px 10px;
  border: 1px solid rgba(246, 240, 231, 0.23);
  color: rgba(246, 240, 231, 0.75);
  background: rgba(31, 43, 35, 0.62);
  font-size: 0.54rem;
  font-weight: 700;
  letter-spacing: 0.13em;
  line-height: 1;
}

.landing-atlas-label.label-one {
  top: 22%;
  right: 12%;
  transform: rotate(2deg);
}

.landing-atlas-label.label-two {
  bottom: 23%;
  left: 9%;
  color: #f2d8c7;
  transform: rotate(-4deg);
}

.landing-atlas-label.label-three {
  right: 39%;
  bottom: 14%;
  transform: rotate(-1deg);
}

.civitas-landing-shell {
  display: grid;
  width: var(--page);
  grid-template-columns: minmax(0, 1.08fr) minmax(315px, 0.72fr);
  grid-template-rows: 1fr auto;
  gap: 34px clamp(30px, 7vw, 118px);
  align-items: center;
  padding-top: clamp(135px, 16vw, 185px);
  padding-bottom: 34px;
}

.civitas-landing-copy {
  max-width: 740px;
  align-self: center;
}

.civitas-landing-kicker {
  margin: 0 0 15px;
  color: #c8d4c2;
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  line-height: 1.4;
  animation: civitas-reveal-up 0.62s 0.08s both ease-out;
}

.civitas-landing-title {
  display: flex;
  align-items: end;
  margin: 0;
  color: #f8f0e5;
  font-family: var(--font-serif);
  font-size: clamp(5.8rem, 13.1vw, 11.8rem);
  font-weight: 500;
  letter-spacing: -0.1em;
  line-height: 0.72;
  animation: civitas-reveal-up 0.72s 0.14s both cubic-bezier(.22,.78,.25,1);
}

.civitas-landing-title i {
  padding-bottom: 0.055em;
  color: #c7aaa9;
  font-style: normal;
}

.civitas-landing-statement {
  max-width: 455px;
  margin: 33px 0 0;
  color: rgba(247, 240, 231, 0.82);
  font-family: var(--font-serif);
  font-size: clamp(1.05rem, 1.7vw, 1.29rem);
  line-height: 1.55;
  animation: civitas-reveal-up 0.62s 0.25s both ease-out;
}

.civitas-landing-entry {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  margin-top: 31px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(246, 240, 231, 0.47);
  color: #f6f0e7;
  font-size: 0.67rem;
  font-weight: 700;
  letter-spacing: 0.045em;
  transition: border-color 0.25s ease, color 0.25s ease, gap 0.25s ease;
  animation: civitas-reveal-up 0.62s 0.32s both ease-out;
}

.civitas-landing-entry i,
.civitas-portal-link > i {
  font-size: 1rem;
  font-style: normal;
}

.civitas-landing-entry:hover {
  gap: 19px;
  border-color: #c7aaa9;
  color: #f5d9c8;
}

.civitas-portal {
  width: 100%;
  padding: 18px 0 0;
  border-top: 1px solid rgba(246, 240, 231, 0.27);
  animation: civitas-reveal-up 0.72s 0.22s both cubic-bezier(.22,.78,.25,1);
}

.civitas-portal > p {
  margin: 0 0 11px;
  color: rgba(202, 218, 197, 0.75);
  font-size: 0.55rem;
  font-weight: 700;
  letter-spacing: 0.16em;
}

.civitas-portal-link {
  display: grid;
  grid-template-columns: 25px 26px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  min-height: 65px;
  padding: 9px 2px;
  border-bottom: 1px solid rgba(246, 240, 231, 0.16);
  color: #f6f0e7;
  transition: color 0.28s ease, padding 0.28s ease, background 0.28s ease;
}

.civitas-portal-link:hover {
  padding-right: 7px;
  padding-left: 7px;
  color: #fff8ef;
  background: rgba(255, 252, 247, 0.055);
}

.civitas-portal-index {
  align-self: start;
  padding-top: 4px;
  color: #c7aaa9;
  font-size: 0.57rem;
  font-weight: 700;
}

.civitas-portal-glyph {
  display: grid;
  width: 25px;
  height: 25px;
  place-items: center;
  border: 1px solid rgba(246, 240, 231, 0.24);
  border-radius: 50%;
  color: #d6e0cf;
}

.civitas-portal-text {
  display: grid;
  gap: 3px;
}

.civitas-portal-text strong {
  font-family: var(--font-serif);
  font-size: 1.05rem;
  font-weight: 500;
  letter-spacing: -0.02em;
}

.civitas-portal-text small {
  overflow: hidden;
  color: rgba(246, 240, 231, 0.57);
  font-size: 0.58rem;
  line-height: 1.25;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.civitas-portal-link > i {
  color: #c7aaa9;
  transition: transform 0.28s ease;
}

.civitas-portal-link:hover > i {
  transform: translateX(5px);
}

.civitas-landing-footer {
  display: flex;
  grid-column: 1 / -1;
  justify-content: space-between;
  gap: 22px;
  padding-top: 20px;
  border-top: 1px solid rgba(246, 240, 231, 0.16);
  color: rgba(246, 240, 231, 0.55);
  font-size: 0.56rem;
  font-weight: 600;
  letter-spacing: 0.05em;
}

.civitas-landing-footer a {
  color: #c9dbbf;
  transition: color 0.2s ease;
}

.civitas-landing-footer a:hover {
  color: #f3d6c5;
}

.civitas-scroll-cue {
  position: absolute;
  right: clamp(19px, 4vw, 50px);
  bottom: 20px;
  display: flex;
  gap: 8px;
  align-items: center;
  color: rgba(246, 240, 231, 0.45);
  font-size: 0.51rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  writing-mode: vertical-rl;
}

.civitas-scroll-cue span {
  width: 1px;
  height: 32px;
  background: rgba(246, 240, 231, 0.5);
  animation: civitas-scroll-line 1.8s infinite ease-in-out;
}

@keyframes civitas-reveal-up {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes civitas-scroll-line {
  0%, 100% { opacity: 0.35; transform: scaleY(0.35); transform-origin: top; }
  50% { opacity: 0.9; transform: scaleY(1); transform-origin: top; }
}

  display: flex;
  gap: 8px;
  align-items: start;
  padding: 10px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.civitas-timeline-filters .civitas-check-filter input {
  width: 13px;
  height: 13px;
  margin: 0;
  accent-color: var(--green);
}

.civitas-timeline-filters .civitas-check-filter span {
  color: var(--ink-soft);
  font-size: 0.58rem;
  line-height: 1.35;
}

.civitas-timeline-stream-top {
  align-items: center;
  min-height: 28px;
  margin-bottom: 15px;
  color: var(--muted);
  font-size: 0.59rem;
  font-weight: 700;
}

.civitas-timeline-group + .civitas-timeline-group {
  margin-top: 38px;
}

.civitas-timeline-group > h2 {
  position: sticky;
  z-index: 2;
  top: 71px;
  margin: 0;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  color: var(--green);
  background: var(--paper);
  font-family: var(--font-serif);
  font-size: 1.22rem;
  font-weight: 500;
  letter-spacing: -0.025em;
}

.civitas-timeline-card {
  display: grid;
  grid-template-columns: 126px minmax(0, 1fr) 31px;
  gap: 18px;
  align-items: start;
  padding: 19px 0;
  border-bottom: 1px solid var(--line);
}

.civitas-timeline-card-date {
  display: grid;
  gap: 7px;
  color: var(--green);
  font-family: var(--font-serif);
  font-size: 0.89rem;
  line-height: 1.14;
}

.civitas-timeline-date-note {
  color: #9d6f6c;
  font-family: var(--font-sans);
  font-size: 0.51rem;
  font-weight: 700;
  letter-spacing: 0.05em;
}

.civitas-timeline-card-context {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 9px;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 0.56rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.civitas-timeline-card-context a {
  color: var(--green);
}

.civitas-timeline-card-body h3 {
  margin: 0;
  font-family: var(--font-serif);
  font-size: clamp(1.11rem, 1.5vw, 1.34rem);
  font-weight: 500;
  letter-spacing: -0.025em;
  line-height: 1.18;
}

.civitas-timeline-card-body h3 a:hover {
  color: var(--green);
}

.civitas-timeline-card-body p {
  margin: 8px 0 0;
  color: var(--ink-soft);
  font-size: 0.69rem;
  line-height: 1.62;
}

.civitas-timeline-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 11px;
}

.civitas-timeline-tags span {
  padding: 4px 6px;
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 0.5rem;
  font-weight: 700;
}

.civitas-timeline-quick-view {
  display: grid;
  width: 30px;
  height: 30px;
  place-items: center;
  padding: 0;
  border: 1px solid var(--line);
  color: var(--green);
  background: transparent;
  font-size: 0.95rem;
  transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
}

.civitas-timeline-quick-view:hover {
  color: #fffdf8;
  background: var(--green);
  transform: translateY(-2px);
}

.civitas-timeline-detail {
  position: sticky;
  top: 94px;
  padding: 23px;
  border: 1px solid #c4c7bd;
  background: #e1e9dc;
}

.civitas-timeline-detail .civitas-eyebrow {
  margin-bottom: 13px;
}

.civitas-timeline-detail h2 {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 1.53rem;
  font-weight: 500;
  letter-spacing: -0.04em;
  line-height: 1.08;
}

.civitas-timeline-detail > p:not(.civitas-eyebrow) {
  margin: 12px 0 0;
  color: var(--ink-soft);
  font-size: 0.68rem;
  line-height: 1.63;
}

.civitas-timeline-detail-meta {
  display: grid;
  gap: 4px;
  margin-top: 16px;
  color: #5c705e;
  font-size: 0.54rem;
  font-weight: 700;
}

.civitas-timeline-detail-links {
  display: grid;
  gap: 0;
  margin-top: 18px;
  border-top: 1px solid rgba(69, 90, 73, 0.2);
}

.civitas-timeline-detail-links a {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 0;
  border-bottom: 1px solid rgba(69, 90, 73, 0.2);
  color: var(--ink);
  font-size: 0.62rem;
  font-weight: 700;
}

.civitas-timeline-detail-links a:hover {
  color: var(--green);
}

.civitas-timeline-detail .civitas-button {
  width: 100%;
  margin-top: 21px;
  border-radius: 0;
  font-size: 0.62rem;
}

.civitas-timeline-detail-empty {
  min-height: 255px;
  background: #eee5dc;
}

.civitas-detail-mark {
  display: grid;
  width: 37px;
  height: 37px;
  margin-bottom: 19px;
  place-items: center;
  border: 1px solid #cbb7a8;
  color: #8b625a;
}

.civitas-timeline-pagination {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  margin-top: 28px;
  color: var(--muted);
  font-size: 0.62rem;
  font-weight: 700;
}

.civitas-timeline-pagination a {
  padding-bottom: 3px;
  border-bottom: 1px solid var(--green);
  color: var(--green);
}

.civitas-timeline-pagination a.is-disabled {
  pointer-events: none;
  opacity: 0.3;
}

.civitas-timeline-empty {
  padding: 42px 26px;
  border: 1px dashed var(--line-strong);
  text-align: center;
}

.civitas-timeline-empty > span {
  color: var(--green);
}

.civitas-timeline-empty h2 {
  margin: 14px 0 0;
  font-family: var(--font-serif);
  font-size: 1.52rem;
  font-weight: 500;
}

.civitas-timeline-empty p {
  max-width: 390px;
  margin: 10px auto 0;
  color: var(--ink-soft);
  font-size: 0.69rem;
  line-height: 1.6;
}

.civitas-timeline-empty a {
  display: inline-block;
  margin-top: 17px;
  padding-bottom: 2px;
  border-bottom: 1px solid currentColor;
  color: var(--green);
  font-size: 0.64rem;
  font-weight: 700;
}

/* Event record ------------------------------------------------------------ */

.civitas-event-hero {
  background: #ead9cb;
}

.civitas-event-hero .civitas-eyebrow {
  margin-bottom: 10px;
}

.civitas-event-date {
  margin: 0 !important;
  color: #7d5c57 !important;
  font-size: 0.75rem !important;
  font-weight: 700;
  letter-spacing: 0.07em;
}

.civitas-event-hero h1 {
  max-width: 870px;
  margin-top: 10px;
}

.civitas-event-hero-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 21px;
}

.civitas-event-hero-meta span {
  padding: 5px 7px;
  border: 1px solid rgba(57, 47, 43, 0.23);
  color: #755a55;
  font-size: 0.53rem;
  font-weight: 700;
}

.civitas-event-layout {
  display: grid;
  grid-template-columns: 168px minmax(0, 660px) minmax(196px, 260px);
  gap: clamp(25px, 5vw, 73px);
  align-items: start;
  padding-top: clamp(44px, 7vw, 82px);
  padding-bottom: clamp(76px, 11vw, 130px);
}

.civitas-event-rail {
  position: sticky;
  top: 94px;
  display: grid;
  border-top: 1px solid var(--line);
}

.civitas-event-rail a {
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  color: var(--ink-soft);
  font-size: 0.61rem;
  font-weight: 700;
  line-height: 1.35;
}

.civitas-event-rail a:hover {
  color: var(--green);
}

.civitas-event-record > section + section {
  margin-top: 38px;
}

.civitas-event-record > section > h2,
.civitas-event-sources h2 {
  margin: 0 0 12px;
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: clamp(1.42rem, 2.3vw, 1.9rem);
  font-weight: 500;
  letter-spacing: -0.04em;
}

.civitas-event-record > section > p {
  margin: 0;
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: 0.96rem;
  line-height: 1.78;
}

.civitas-event-facts {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  padding: 15px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.civitas-event-facts span {
  display: block;
  color: var(--green);
  font-size: 0.51rem;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.civitas-event-facts p {
  margin: 6px 0 0;
  color: var(--ink-soft);
  font-size: 0.64rem;
  line-height: 1.5;
}

.civitas-entity-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.civitas-entity-chips span {
  padding: 7px 8px;
  border: 1px solid var(--line);
  color: var(--ink-soft);
  font-size: 0.61rem;
  font-weight: 700;
}

.civitas-event-caution {
  display: grid;
  grid-template-columns: 25px minmax(0, 1fr);
  gap: 11px;
  margin-top: 38px;
  padding: 17px;
  border: 1px solid #d7bbaa;
  background: #f4e9e0;
}

.civitas-event-caution > span {
  color: #8d625c;
  font-family: var(--font-serif);
  font-size: 1.5rem;
}

.civitas-event-caution strong {
  color: #765a53;
  font-size: 0.66rem;
}

.civitas-event-caution p {
  margin: 6px 0 0;
  color: #795f58;
  font-size: 0.66rem;
  line-height: 1.55;
}

.civitas-event-sources {
  display: grid;
  gap: 14px;
  padding-top: 28px;
  border-top: 1px solid var(--line);
}

.civitas-event-sources .civitas-eyebrow {
  margin-bottom: 10px;
}

.civitas-event-sources > div > p:not(.civitas-eyebrow) {
  margin: 0;
  color: var(--muted);
  font-size: 0.65rem;
  line-height: 1.5;
}

.civitas-event-source {
  position: relative;
  display: grid;
  gap: 5px;
  padding: 14px 38px 14px 15px;
  border: 1px solid var(--line);
  color: var(--ink);
  background: var(--white);
  transition: border-color 0.2s ease, transform 0.2s ease;
}

.civitas-event-source:hover {
  border-color: var(--green);
  transform: translateX(3px);
}

.civitas-event-source span {
  color: var(--green);
  font-size: 0.5rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.civitas-event-source strong {
  font-family: var(--font-serif);
  font-size: 0.94rem;
  font-weight: 500;
}

.civitas-event-source small {
  color: var(--muted);
  font-size: 0.56rem;
  line-height: 1.4;
}

.civitas-event-source i {
  position: absolute;
  top: 18px;
  right: 15px;
  color: var(--green);
  font-size: 0.91rem;
  font-style: normal;
}

.civitas-event-related {
  position: sticky;
  top: 94px;
  display: grid;
  gap: 0;
}

.civitas-event-related .civitas-eyebrow {
  margin-bottom: 12px;
}

.civitas-event-related > a {
  position: relative;
  display: grid;
  gap: 5px;
  padding: 13px 22px 13px 0;
  border-top: 1px solid var(--line);
  color: var(--ink);
}

.civitas-event-related > a:last-of-type {
  border-bottom: 1px solid var(--line);
}

.civitas-event-related > a:hover strong {
  color: var(--green);
}

.civitas-event-related span {
  color: var(--green);
  font-size: 0.53rem;
  font-weight: 700;
}

.civitas-event-related strong {
  font-family: var(--font-serif);
  font-size: 0.94rem;
  font-weight: 500;
  line-height: 1.15;
}

.civitas-event-related i {
  position: absolute;
  top: 50%;
  right: 1px;
  color: var(--green);
  font-style: normal;
  transform: translateY(-50%);
}

.civitas-event-related > p:not(.civitas-eyebrow) {
  color: var(--muted);
  font-size: 0.65rem;
  line-height: 1.5;
}

/* Coverage audit ---------------------------------------------------------- */

.civitas-coverage-hero > .page-width > div {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 23px;
}

.civitas-coverage-hero > .page-width > div span {
  padding: 6px 8px;
  border: 1px solid rgba(57, 47, 43, 0.18);
  color: #705c52;
  font-size: 0.55rem;
  font-weight: 700;
}

.civitas-coverage-page {
  padding-top: clamp(44px, 6vw, 77px);
  padding-bottom: clamp(76px, 10vw, 120px);
}

.civitas-coverage-note {
  max-width: 720px;
  margin: 0;
  padding: 18px 20px;
  border-left: 2px solid var(--green);
  color: var(--ink-soft);
  background: #eef2ea;
  font-family: var(--font-serif);
  font-size: 0.96rem;
  line-height: 1.62;
}

.civitas-coverage-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(25px, 6vw, 78px);
  margin-top: 52px;
}

.civitas-coverage-grid section h2,
.civitas-country-directory h2 {
  margin: 0 0 14px;
  font-family: var(--font-serif);
  font-size: 1.6rem;
  font-weight: 500;
  letter-spacing: -0.04em;
}

.civitas-coverage-grid section > a {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 16px;
  gap: 9px;
  align-items: center;
  padding: 12px 0;
  border-top: 1px solid var(--line);
  color: var(--ink);
  font-size: 0.68rem;
  font-weight: 700;
}

.civitas-coverage-grid section > a:last-child {
  border-bottom: 1px solid var(--line);
}

.civitas-coverage-grid section > a:hover {
  color: var(--green);
}

.civitas-coverage-grid i {
  color: var(--green);
  font-style: normal;
}

.coverage-status {
  padding: 4px 5px;
  font-size: 0.48rem;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  white-space: nowrap;
}

.coverage-status.researched,
.coverage-status.source-backed { color: #3f6542; background: #dcebd7; }
.coverage-status.partially-covered { color: #6e6540; background: #eee4bd; }
.coverage-status.sparse-documentation { color: #825f53; background: #f0dbcf; }
.coverage-status.not-yet-researched { color: #756e66; background: #e9e6df; }
.coverage-status.needs-review { color: #815c59; background: #efd9d8; }

.civitas-country-directory {
  margin-top: 73px;
  padding-top: 34px;
  border-top: 1px solid var(--line);
}

.civitas-country-directory > div:first-child {
  max-width: 640px;
}

.civitas-country-directory .civitas-eyebrow {
  margin-bottom: 10px;
}

.civitas-country-directory-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 7px;
  margin-top: 25px;
}

.civitas-country-directory-grid a {
  display: grid;
  gap: 5px;
  min-height: 95px;
  align-content: start;
  padding: 12px;
  border: 1px solid var(--line);
  color: var(--ink);
  background: var(--white);
  transition: border-color 0.2s ease, transform 0.2s ease;
}

.civitas-country-directory-grid a:hover {
  border-color: var(--green);
  transform: translateY(-2px);
}

.civitas-country-directory-grid span {
  font-family: var(--font-serif);
  font-size: 0.95rem;
  font-weight: 500;
  line-height: 1.1;
}

.civitas-country-directory-grid small {
  color: var(--muted);
  font-size: 0.53rem;
}

.civitas-country-directory-grid .coverage-status {
  justify-self: start;
  margin-top: auto;
}

:root[data-theme="dark"] .civitas-timeline-hero,
:root[data-theme="dark"] .civitas-coverage-hero,
:root[data-theme="dark"] .civitas-event-hero {
  background: #293229;
}

:root[data-theme="dark"] .civitas-period-rail a { background: #303a30; }
:root[data-theme="dark"] .civitas-period-rail a:nth-child(2n) { background: #3d4a3b; }
:root[data-theme="dark"] .civitas-period-rail a:nth-child(3n) { background: #4a3e37; }
:root[data-theme="dark"] .civitas-timeline-search { border-color: var(--line-strong); background: var(--white); }
:root[data-theme="dark"] .civitas-timeline-group > h2 { background: var(--paper); }
:root[data-theme="dark"] .civitas-timeline-detail { border-color: #586554; background: #354335; }
:root[data-theme="dark"] .civitas-timeline-detail-empty { background: #423a35; }
:root[data-theme="dark"] .civitas-event-caution { border-color: #785a50; background: #3b312d; }
:root[data-theme="dark"] .civitas-event-caution strong,
:root[data-theme="dark"] .civitas-event-caution p { color: #e2c3b4; }
:root[data-theme="dark"] .civitas-coverage-note { background: #2f3b2f; }
:root[data-theme="dark"] .coverage-status.researched,
:root[data-theme="dark"] .coverage-status.source-backed { color: #cce5c4; background: #38503a; }
:root[data-theme="dark"] .coverage-status.partially-covered { color: #eddd9d; background: #5d5331; }
:root[data-theme="dark"] .coverage-status.sparse-documentation { color: #ecc2ae; background: #594139; }
:root[data-theme="dark"] .coverage-status.not-yet-researched { color: #d5cec4; background: #414843; }
:root[data-theme="dark"] .coverage-status.needs-review { color: #e7bab8; background: #583b3d; }

@media (max-width: 1120px) {
  .civitas-landing-shell { grid-template-columns: minmax(0, 1fr) minmax(285px, 0.72fr); }
  .civitas-timeline-layout { grid-template-columns: 210px minmax(0, 1fr); }
  .civitas-timeline-detail { position: static; grid-column: 2; }
  .civitas-event-layout { grid-template-columns: 148px minmax(0, 1fr); }
  .civitas-event-related { position: static; grid-column: 2; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
  .civitas-event-related .civitas-eyebrow { grid-column: 1 / -1; }
}

@media (max-width: 860px) {
  .app-route-home .site-header.civitas-header { position: relative; background: #1d2921; }
  .app-route-home .mobile-nav { border-bottom-color: rgba(246, 240, 231, 0.18); color: #f6f0e7; background: #1d2921; }
  .app-route-home .mobile-nav a { color: #f6f0e7; }
  .civitas-home--landing .civitas-landing { min-height: auto; }
  .civitas-landing-shell { grid-template-columns: 1fr; grid-template-rows: auto auto auto; gap: 41px; padding-top: 72px; padding-bottom: 32px; }
  .civitas-landing-copy { max-width: 580px; }
  .civitas-landing-title { font-size: clamp(5.2rem, 21vw, 8.3rem); }
  .civitas-landing-statement { max-width: 470px; }
  .civitas-portal { max-width: 570px; }
  .civitas-landing-footer { grid-column: auto; align-items: start; flex-direction: column; }
  .civitas-scroll-cue { display: none; }
  .civitas-landing-atlas { opacity: 0.66; }
  .civitas-timeline-layout { grid-template-columns: 1fr; }
  .civitas-timeline-filters { position: static; padding: 17px; border: 1px solid var(--line); background: var(--white); }
  .civitas-timeline-filters form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .civitas-filter-title, .civitas-timeline-filters .civitas-check-filter { grid-column: 1 / -1; }
  .civitas-timeline-detail { grid-column: auto; }
  .civitas-timeline-group > h2 { top: 0; }
  .civitas-event-layout { grid-template-columns: 1fr; }
  .civitas-event-rail { position: static; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .civitas-event-related { grid-column: auto; }
  .civitas-country-directory-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (max-width: 620px) {
  .app-route-home .civitas-header .saved-trigger span,
  .app-route-home .civitas-header .civitas-search-trigger span { display: none; }
  .civitas-landing-shell { padding-top: 48px; }
  .civitas-landing-kicker { max-width: 290px; }
  .civitas-landing-statement { margin-top: 28px; font-size: 1.02rem; }
  .civitas-portal-link { grid-template-columns: 22px 25px minmax(0, 1fr) auto; min-height: 62px; }
  .civitas-portal-text small { display: none; }
  .civitas-landing-footer { font-size: 0.51rem; }
  .landing-atlas-label.label-three { display: none; }
  .civitas-timeline-hero,
  .civitas-coverage-hero,
  .civitas-event-hero { padding-top: 64px; }

const localizeRecords = (records, copy = {}) => records.map((record) => ({ ...record, ...(copy[record.id] || {}) }));

function collectionsForLanguage(language) {
  const collator = new Intl.Collator(language, { sensitivity: "base" });
  const topicTitles = new Map(sourceTopics.map((topic) => [topic.id, topic.title]));

  if (language === "vi") {
    const topics = sourceTopics.map((record) => ({ ...record }));
    return {
      topics,
      articles: sourceArticles
        .map((record) => ({ ...record, domain: topicTitles.get(record.domain) || record.domain }))
        .sort((a, b) => collator.compare(a.title, b.title)),
      glossary: sourceGlossary
        .map((record) => ({ ...record, aliases: [record.english].filter(Boolean) }))
        .sort((a, b) => collator.compare(a.term, b.term)),
      countries: sourceCountries
        .map((record) => ({ ...record }))
        .sort((a, b) => collator.compare(a.region, b.region) || collator.compare(a.name, b.name)),
      ideologies: sourceIdeologies.map((record) => ({ ...record })),
      events: sourceEvents.map((record) => ({ ...record })).sort((a, b) => String(a.date).localeCompare(String(b.date), "vi")),
      sources: sourceSources
        .map((record) => ({ ...record }))
        .sort((a, b) => collator.compare(a.kind, b.kind) || Number(b.year || 0) - Number(a.year || 0) || collator.compare(a.title, b.title)),
      relationships: sourceRelationships.map((record) => ({ ...record })),
      fullTaxonomy: sourceTopics.map((topic) => topic.title),
    };
  }

  const topics = localizeRecords(sourceTopics, englishCopy.topics);
  return {
    topics,
    articles: localizeRecords(sourceArticles, englishCopy.articles)
      .map((record) => ({ ...record, domain: englishCopy.topics[record.domain]?.title || record.domain }))
      .sort((a, b) => collator.compare(a.title, b.title)),
    glossary: sourceGlossary.map((record) => ({
      ...record,
      ...(englishCopy.glossary[record.id] || {}),
      aliases: [record.term, record.english].filter(Boolean),
      english: "",
    })).sort((a, b) => collator.compare(a.term, b.term)),
    countries: localizeRecords(sourceCountries, englishCopy.countries)
      .sort((a, b) => collator.compare(a.region, b.region) || collator.compare(a.name, b.name)),
    ideologies: localizeRecords(sourceIdeologies, englishCopy.ideologies),
    events: localizeRecords(sourceEvents, englishCopy.events).sort((a, b) => String(a.date).localeCompare(String(b.date), "en")),
    sources: sourceSources.map((record) => ({
      ...record,
      ...(englishCopy.sources[record.id] || {}),
      kind: englishCopy.sourceKinds[record.kind] || record.kind,
    })).sort((a, b) => collator.compare(a.kind, b.kind) || Number(b.year || 0) - Number(a.year || 0) || collator.compare(a.title, b.title)),
    relationships: sourceRelationships.map((record) => ({
      ...record,
      label: englishCopy.relationshipLabels[record.label] || record.label,
    })),
    fullTaxonomy: sourceTopics.map((topic) => englishCopy.topics[topic.id]?.title || topic.title),
  };
}

function emptyLearningProgress() {
  return {
    version: 2,
    profile: { entryMode: "new", activePathId: "start", selfAssessedIds: [] },
    nodes: {},
    readArticles: {},
    checks: {},
    updatedAt: null,
  };
}

function hasLearningNode(id) {
  return learningNodes.some((node) => node.id === id);
}

function normalizeLearningProgress(raw) {
  const clean = emptyLearningProgress();
  if (!raw || typeof raw !== "object") return clean;
  const profile = raw.profile && typeof raw.profile === "object" ? raw.profile : {};
  clean.profile.entryMode = learningProfiles.some((item) => item.id === profile.entryMode) ? profile.entryMode : clean.profile.entryMode;
  clean.profile.activePathId = learningPaths.some((item) => item.id === profile.activePathId) ? profile.activePathId : clean.profile.activePathId;
  clean.profile.selfAssessedIds = Array.isArray(profile.selfAssessedIds) ? profile.selfAssessedIds.filter(hasLearningNode) : [];

  if (raw.nodes && typeof raw.nodes === "object") {
    Object.entries(raw.nodes).forEach(([nodeId, entry]) => {
      if (!hasLearningNode(nodeId) || !entry || typeof entry !== "object" || !LEARNING_STATUSES.has(entry.status)) return;
      clean.nodes[nodeId] = {
        status: entry.status,
        updatedAt: typeof entry.updatedAt === "string" ? entry.updatedAt : null,
      };
    });
  }

  if (raw.readArticles && typeof raw.readArticles === "object") {
    Object.entries(raw.readArticles).forEach(([articleId, updatedAt]) => {
      if (!sourceArticles.some((article) => article.id === articleId) || typeof updatedAt !== "string") return;
      clean.readArticles[articleId] = updatedAt;
    });
  }

  if (raw.checks && typeof raw.checks === "object") {
    Object.entries(raw.checks).forEach(([checkId, entry]) => {
      const check = learningCheck.find((item) => item.id === checkId);
      if (!check || !entry || typeof entry !== "object") return;
      clean.checks[checkId] = {
        attempts: Number.isFinite(entry.attempts) ? Math.max(0, entry.attempts) : 0,
        selectedIndex: Number.isInteger(entry.selectedIndex) ? entry.selectedIndex : null,
        correct: typeof entry.correct === "boolean" ? entry.correct : null,
        attemptedAt: typeof entry.attemptedAt === "string" ? entry.attemptedAt : null,
      };
    });
  }

  clean.updatedAt = typeof raw.updatedAt === "string" ? raw.updatedAt : null;
  return clean;
}

function loadLearningProgress() {
  try {
    const saved = localStorage.getItem(LEARNING_PROGRESS_KEY) || localStorage.getItem(LEGACY_LEARNING_PROGRESS_KEY);
    return normalizeLearningProgress(JSON.parse(saved || "null"));
  } catch {
    return emptyLearningProgress();
  }
}

let learningProgress = loadLearningProgress();

function saveLearningProgress() {
  learningProgress.updatedAt = new Date().toISOString();
  try {
    localStorage.setItem(LEARNING_PROGRESS_KEY, JSON.stringify(learningProgress));
    return true;
  } catch {
    return false;
  }
}

function learningNodeProgress(nodeId) {
  return learningProgress.nodes[nodeId] || { status: "not_started", updatedAt: null };
}

function learningStatus(nodeId) {
  return learningNodeProgress(nodeId).status;
}

function setLearningStatus(nodeId, status) {
  if (!hasLearningNode(nodeId) || !LEARNING_STATUSES.has(status)) return false;
  if (status === "not_started") {
    delete learningProgress.nodes[nodeId];
  } else {
    learningProgress.nodes[nodeId] = { status, updatedAt: new Date().toISOString() };
  }
  return saveLearningProgress();
}

function isArticleRead(articleId) {
  return Boolean(learningProgress.readArticles[articleId] || learningStatus(articleId) === "read");
}

function setArticleRead(articleId, read = true) {
  if (!sourceArticles.some((article) => article.id === articleId)) return false;
  if (read) learningProgress.readArticles[articleId] = new Date().toISOString();
  else delete learningProgress.readArticles[articleId];
  return saveLearningProgress();
}

function loadBookmarks() {
  try {
    const raw = JSON.parse(localStorage.getItem(BOOKMARKS_KEY) || "[]");
    return new Set(Array.isArray(raw) ? raw.filter((id) => sourceArticles.some((article) => article.id === id)) : []);
  } catch {
    return new Set();
  }
}

let bookmarkedArticleIds = loadBookmarks();

function isBookmarked(articleId) {
  return bookmarkedArticleIds.has(articleId);
}

function saveBookmarks() {
  try {
    localStorage.setItem(BOOKMARKS_KEY, JSON.stringify([...bookmarkedArticleIds]));
    return true;
  } catch {
    return false;
  }
}

function toggleBookmark(articleId) {
  if (!sourceArticles.some((article) => article.id === articleId)) return false;
  if (bookmarkedArticleIds.has(articleId)) bookmarkedArticleIds.delete(articleId);
  else bookmarkedArticleIds.add(articleId);
  return saveBookmarks();
}

function selectLearningProfile(profileId) {
  const profile = learningProfiles.find((item) => item.id === profileId);
  if (!profile) return false;
  learningProgress.profile.entryMode = profile.id;
  learningProgress.profile.activePathId = profile.pathId;
  return saveLearningProgress();
}

function prefersReducedMotion() {
  return window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches ?? false;
}

function changeTheme(theme) {
  if (!["light", "dark"].includes(theme) || theme === currentTheme) return;

  currentTheme = theme;
  document.documentElement.classList.add("theme-transition");
  updateDocumentTheme();

  try {
    localStorage.setItem("politicore-theme", currentTheme);
  } catch {
    // The theme is still applied for the current session.
  }

  window.clearTimeout(themeTransitionTimer);
  themeTransitionTimer = window.setTimeout(() => {
    document.documentElement.classList.remove("theme-transition");
  }, prefersReducedMotion() ? 0 : 460);
}

function toggleTheme() {
  changeTheme(currentTheme === "dark" ? "light" : "dark");
}

function changeLanguage(language) {
  if (!["en", "vi"].includes(language) || language === currentLanguage) return;

  const selectedLeftId = sourceRecordId(state.compareLeft, sourceIdeologies, englishCopy.ideologies);
  const selectedRightId = sourceRecordId(state.compareRight, sourceIdeologies, englishCopy.ideologies);
  ({ topics, articles, glossary, countries, ideologies, events, sources, relationships, fullTaxonomy } = collectionsForLanguage(language));
  currentLanguage = language;
  state.compareLeft = ideologies.find((item) => item.id === selectedLeftId)?.slug || ideologies[0]?.slug || "";
  state.compareRight = ideologies.find((item) => item.id === selectedRightId)?.slug || ideologies[1]?.slug || ideologies[0]?.slug || "";
  state.glossaryLetter = "all";
  updateDocumentLanguage();

  try {
    localStorage.setItem("politicore-language", currentLanguage);
  } catch {
    // The toggle still works when storage is unavailable.
  }
}

const uiTextEntries = Object.entries(uiText).sort(([a], [b]) => b.length - a.length);

function translateUiText(value = "") {
  if (currentLanguage === "vi") return String(value);
  return uiTextEntries.reduce((result, [vietnamese, english]) => result.replaceAll(vietnamese, english), String(value));
}

function routeFor(record) {
  if (!record) return "home";
  if (record.type === "article") return `article/${record.slug}`;
  if (record.type === "country") return `country/${record.slug}`;
  if (record.type === "ideology") return `ideology/${record.slug}`;
  if (record.type === "glossary") return `glossary?term=${encodeURIComponent(record.term)}`;
  if (record.type === "timeline-event") return `timeline/event/${record.slug}`;
  if (record.type === "timeline-entity") return `timeline/entity/${record.id}`;
  if (record.type === "event") return "timeline";
  if (record.type === "source") return "sources";
  return "home";
}

function navigate(path) {
  location.hash = `#${path}`;

  const sourceArticle = sourceArticleById(article?.id);
  const domainId = sourceArticle?.domain;
  return civitasCategories.find((category) => category.articleIds.includes(article?.id))
    || civitasCategories.find((category) => category.domainIds.includes(domainId))
    || civitasCategories[0];
}

function learningNodeById(nodeId) {

}

function learningPathById(pathId) {

}

function articleForLearningNode(node) {
  return node ? articleByReference(node.articleId) : undefined;
}

function learningNodeTitle(node) {
  return articleForLearningNode(node)?.title || node?.articleId || "";
}

function learningNodeRoute(node) {
  const article = articleForLearningNode(node);
  return `#article/${encodeURIComponent(article?.slug || node?.articleId || "")}`;
}

function learningRoute(pathId, nodeId = "") {
  const params = new URLSearchParams();
  if (pathId) params.set("path", pathId);
  if (nodeId) params.set("node", nodeId);
  return `roadmap${params.size ? `?${params.toString()}` : ""}`;
}

function mapRoute(categoryId = "all", nodeId = "", mode = "overview", query = "") {
  const params = new URLSearchParams();
  if (categoryId && categoryId !== "all") params.set("category", categoryId);
  if (nodeId) params.set("node", nodeId);
  if (mode && mode !== "overview") params.set("mode", mode);
  if (query) params.set("q", query);
  return `map${params.size ? `?${params.toString()}` : ""}`;
}

function learningStatusLabel(status) {
  const labels = {
    not_started: ["Chưa học", "Not started"],
    read: ["Đã đọc", "Read"],
    learning: ["Đang học", "Learning"],
    mastered: ["Đã nắm vững", "Mastered"],
    review: ["Cần ôn tập", "Needs review"],
    skipped: ["Bỏ qua lúc này", "Skipped for now"],
  };
  const [vietnamese, english] = labels[status] || labels.not_started;
  return bilingualText(vietnamese, english);
}

function learningStatusSymbol(status) {
  return {
    not_started: "○",
    read: "◌",
    learning: "◐",
    mastered: "✓",
    review: "↺",
    skipped: "—",
  }[status] || "○";
}

function learningPrerequisites(node) {
  return (node?.prerequisiteIds || []).map(learningNodeById).filter(Boolean);
}

function prerequisiteSatisfied(nodeId) {
  return learningStatus(nodeId) === "mastered";
}

function missingPrerequisites(node) {
  return learningPrerequisites(node).filter((item) => !prerequisiteSatisfied(item.id));
}

function pathNodeIdsWithPrerequisites(pathId) {
  const path = learningPathById(pathId);
  const selected = new Set();
  const visit = (nodeId) => {
    if (selected.has(nodeId)) return;
    const node = learningNodeById(nodeId);
    if (!node) return;
    selected.add(nodeId);
    learningPrerequisites(node).forEach((prerequisite) => visit(prerequisite.id));
  };
  (path?.nodeIds || learningNodes.map((node) => node.id)).forEach(visit);
  return selected;
}

function recommendedLearningNodes(pathId) {
  const included = pathNodeIdsWithPrerequisites(pathId);
  const candidates = learningNodes.filter((node) => included.has(node.id) && !["mastered", "skipped"].includes(learningStatus(node.id)));
  return candidates.sort((left, right) => {
    const leftStatus = learningStatus(left.id);
    const rightStatus = learningStatus(right.id);
    const leftPriority = leftStatus === "review" ? -2 : leftStatus === "learning" ? -1 : 0;
    const rightPriority = rightStatus === "review" ? -2 : rightStatus === "learning" ? -1 : 0;
    if (leftPriority !== rightPriority) return leftPriority - rightPriority;
    const missingDifference = missingPrerequisites(left).length - missingPrerequisites(right).length;
    if (missingDifference) return missingDifference;
    return learningNodeTitle(left).localeCompare(learningNodeTitle(right), currentLanguage);
  });
}

function learningProgressCounts() {
  const counts = { read: 0, learning: 0, mastered: 0, review: 0 };
  learningNodes.forEach((node) => {
    const status = learningStatus(node.id);
    if (Object.hasOwn(counts, status)) counts[status] += 1;
  });
  return counts;
}

function validateLearningGraph() {
  const errors = [];
  const nodeIds = new Set(learningNodes.map((node) => node.id));

  learningNodes.forEach((node) => {
    if (!articleByReference(node.articleId)) errors.push(`missing article: ${node.articleId}`);
    (node.prerequisiteIds || []).forEach((id) => {
      if (!nodeIds.has(id)) errors.push(`missing prerequisite: ${node.id} → ${id}`);
    });
  });

  const visiting = new Set();
  const visited = new Set();
  const visit = (nodeId) => {
    if (visiting.has(nodeId)) {
      errors.push(`prerequisite cycle at: ${nodeId}`);
      return;
    }
    if (visited.has(nodeId)) return;
    visiting.add(nodeId);
    learningPrerequisites(learningNodeById(nodeId)).forEach((node) => visit(node.id));
    visiting.delete(nodeId);
    visited.add(nodeId);
  };
  learningNodes.forEach((node) => visit(node.id));
  return errors;
}

const learningGraphIssues = validateLearningGraph();
if (learningGraphIssues.length) console.warn("PolitiCore learning graph validation:", learningGraphIssues);

}

function encyclopediaRoute({ category = "all", level = "all", saved = false, query = "" } = {}) {
  const params = new URLSearchParams();
  if (category !== "all") params.set("category", category);
  if (level !== "all") params.set("level", level);
  if (saved) params.set("saved", "1");
  if (query) params.set("q", query);
  return `encyclopedia${params.size ? `?${params.toString()}` : ""}`;
}

function renderEncyclopedia(params) {
  const selectedCategory = civitasCategories.some((category) => category.id === params.get("category")) ? params.get("category") : "all";
  const selectedLevel = ["all", "intro", "intermediate"].includes(params.get("level")) ? params.get("level") : "all";
  const showSaved = params.get("saved") === "1";
  const query = (params.get("q") || "").trim();
  const normalizedQuery = query.toLocaleLowerCase(currentLanguage);
  const records = articles.filter((article) => {
    const category = civitasCategoryForArticle(article);
    const node = learningNodeForArticle(article.id);
    const level = node?.level === "Trung cấp" ? "intermediate" : "intro";
    const text = [article.title, article.summary, articleCategoryLabel(article)].join(" ").toLocaleLowerCase(currentLanguage);
    return (selectedCategory === "all" || category.id === selectedCategory)
      && (selectedLevel === "all" || level === selectedLevel)
      && (!showSaved || isBookmarked(article.id))
      && (!normalizedQuery || text.includes(normalizedQuery));
  });

  return `
    <section class="civitas-page-heading">
      <div class="page-width"><nav class="civitas-breadcrumb" aria-label="Breadcrumb"><a href="#home">${bilingualText("Khám phá", "Explore")}</a><span>/</span><span>${bilingualText("Bách khoa", "Encyclopedia")}</span></nav><p class="civitas-eyebrow">THE LITTLE LIBRARY</p><h1>${bilingualText("Bách khoa toàn thư", "The encyclopedia")}</h1><p>${bilingualText("Đọc tự do, theo một câu hỏi, một chủ đề hoặc bất kỳ điểm vào nào phù hợp với bạn.", "Read freely—through a question, a topic, or any entry point that fits you.")}</p></div>
    </section>
    <section class="page-width civitas-encyclopedia">
      <form class="civitas-library-search" data-encyclopedia-search>
        ${icon("search", 19)}<input name="query" value="${escapeHtml(query)}" autocomplete="off" placeholder="${bilingualText("Tìm bài viết trong thư viện...", "Search the library...")}" aria-label="${bilingualText("Tìm bài viết", "Search articles")}" /><button type="submit">${bilingualText("Tìm", "Search")}</button>
      </form>

          ${content.map((section, index) => `

              <h2>${escapeHtml(section.heading)}</h2>

function normalizedContent(article) {
  if (Array.isArray(article.content) && article.content.length) {
    return article.content.map((section) => {
      if (typeof section === "string") return { heading: "Góc nhìn tham chiếu", paragraphs: [section] };
      return {
        heading: section.heading || section.title || "Góc nhìn tham chiếu",
        paragraphs: Array.isArray(section.paragraphs) ? section.paragraphs : [section.body || section.text || article.summary],
      };
    });
  }
  return [
    { heading: "Phạm vi và cách dùng", paragraphs: [article.summary, "Mục tham chiếu này được thiết kế để định hướng khái niệm, dẫn đến các nguồn có thể kiểm tra và mở ra những liên hệ phù hợp."] },
    { heading: "Bối cảnh và tranh luận", paragraphs: ["Trong khoa học chính trị, cùng một thuật ngữ có thể được dùng theo nhiều truyền thống nghiên cứu. Vì vậy, định nghĩa nên được đọc cùng phạm vi, tiêu chí và bối cảnh lịch sử của nó."] },
    { heading: "Các mối liên hệ", paragraphs: ["Khái niệm này liên quan đến những mục khác trong thư viện, giúp người đọc so sánh cơ chế, thiết chế và cách diễn giải thay vì coi nó như một nhãn độc lập."] },
  ];
}

function articleFigure(article) {
  const isSeparation = article.id === "separation-of-powers" || article.title.toLowerCase().includes("phân quyền");
  return `

      ${isSeparation
        ? `<div class="power-diagram"><div class="power-node">Lập pháp<small>làm luật &amp; giám sát</small></div><div class="power-node">Hành pháp<small>thi hành &amp; quản trị</small></div><div class="power-node">Tư pháp<small>xét xử &amp; giải thích luật</small></div></div>`
        : `<div class="power-diagram"><div class="power-node">Khái niệm<small>định nghĩa &amp; phạm vi</small></div><div class="power-node">Bối cảnh<small>lịch sử &amp; thể chế</small></div><div class="power-node">Nguồn<small>văn bản &amp; nghiên cứu</small></div></div>`}
      <figcaption>Minh hoạ cấu trúc đọc trong bản demo; không thay thế mô tả pháp lý hoặc dữ liệu thực chứng chi tiết.</figcaption>
    </figure>
  `;
}

function relatedArticlesFor(article) {
  const ids = new Set(article?.related || article?.relatedSlugs || []);
  relationships.forEach((relation) => {
    const source = String(relation.source || relation.sourceId || "").replace(/^article:/, "");
    const target = String(relation.target || relation.targetId || "").replace(/^article:/, "");
    if (source === article?.id && target && sourceArticles.some((item) => item.id === target)) ids.add(target);
    if (target === article?.id && source && sourceArticles.some((item) => item.id === source)) ids.add(source);
  });
  return [...ids]
    .map((id) => articleByReference(id))
    .filter((item) => item && item.id !== article?.id)
    .slice(0, 4);
}

function renderGlossary(params) {
  const query = (params.get("q") || params.get("term") || "").trim().toLocaleLowerCase(currentLanguage);
  const letter = params.get("letter") || state.glossaryLetter;
  const records = glossary.filter((item) => {
    const term = (item.term || item.title || "").toLocaleLowerCase(currentLanguage);
    const definition = (item.definition || item.summary || "").toLocaleLowerCase(currentLanguage);
    const aliases = (item.aliases || []).join(" ").toLocaleLowerCase(currentLanguage);
    const matchQuery = !query || term.includes(query) || definition.includes(query) || aliases.includes(query);
    const matchLetter = letter === "all" || term.startsWith(letter.toLocaleLowerCase(currentLanguage));
    return matchQuery && matchLetter;
  });
  const grouped = records.reduce((groups, item) => {
    const first = (item.term || item.title || "?").charAt(0).toUpperCase();
    groups[first] ||= [];
    groups[first].push(item);
    return groups;
  }, {});
  const alphabet = [...new Set(glossary.map((item) => (item.term || item.title || "?").charAt(0).toUpperCase()))]
    .sort((a, b) => a.localeCompare(b, currentLanguage));

  return `
    ${pageHero("Thuật ngữ chính trị", "Từ điển khái niệm", "Định nghĩa ngắn để định hướng, cùng thuật ngữ tiếng Anh và đường dẫn sang các mục tham chiếu sâu hơn.")}
    <div class="page-width">
      <div class="tool-bar">
        <form class="filter-group" data-glossary-search>
          <input class="filter-select" name="term" value="${escapeHtml(params.get("q") || params.get("term") || "")}" placeholder="Tìm thuật ngữ..." aria-label="Tìm thuật ngữ" />
          <button class="filter-button" type="submit">Tìm</button>
        </form>
        <span class="result-count">${records.length} thuật ngữ trong bản demo</span>
      </div>
      <nav class="alpha-nav" aria-label="Duyệt theo chữ cái">
        <button class="${letter === "all" ? "active" : ""}" data-route="glossary">Tất</button>
        ${alphabet.map((char) => `<button class="${letter === char ? "active" : ""}" data-route="glossary?letter=${encodeURIComponent(char)}">${char}</button>`).join("")}
      </nav>
      <section class="glossary-list">
        ${Object.keys(grouped).length ? Object.entries(grouped).sort(([a], [b]) => a.localeCompare(b, currentLanguage)).map(([char, items]) => `
          <section class="glossary-group">
            <div class="glossary-letter">${char}</div>
            <div class="glossary-entries">
              ${items.map((item) => `
                <a class="glossary-entry" href="#article/${articlePath(item.articleSlug || item.related?.[0])}">
                  <div class="glossary-term">${escapeHtml(item.term || item.title)}${item.english || item.translation ? `<span>${escapeHtml(item.english || item.translation)}</span>` : ""}</div>
                  <p class="glossary-definition">${escapeHtml(item.definition || item.summary)}</p>
                </a>
              `).join("")}
            </div>
          </section>
        `).join("") : emptyState("Không tìm thấy thuật ngữ", "Thử thay đổi từ khoá hoặc duyệt theo chữ cái.")}
      </section>
    </div>
  `;
}

function renderCountries(params) {
  const region = params.get("region") || "all";
  const visible = region === "all" ? countries : countries.filter((country) => country.region === region);
